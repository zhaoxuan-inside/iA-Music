<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>iA-Music · 黑胶金时代 设计原型</title>
  <style>
:root{
  --accent:#F1006E;
  --canvas:#000;
  --t1:rgba(255,255,255,.92);
  --t2:rgba(255,255,255,.55);
  --t3:rgba(255,255,255,.35);
  --sep:rgba(255,255,255,.06);
  --sep2:rgba(255,255,255,.14);
  --ease:cubic-bezier(.22,.9,.26,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* 全站隐藏滚动条（保留滚动能力） */
::-webkit-scrollbar{width:0;height:0;display:none}
*{scrollbar-width:none;-ms-overflow-style:none}
html,body{height:100%;background:#0b0b0e;color:var(--t1);
  font-family:"Segoe UI","Microsoft YaHei UI","Microsoft YaHei",-apple-system,"PingFang SC",sans-serif;
  user-select:none;-webkit-user-select:none}
::selection{background:var(--accent);color:#fff}
button{background:none;border:none;color:inherit;font:inherit;cursor:pointer}

/* ---------- 桌面舞台 ---------- */
#desk{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px}
#phone{width:412px;height:892px;border-radius:30px;border:1px solid #26262b;background:#000;
  overflow:hidden;position:relative;box-shadow:0 30px 90px rgba(0,0,0,.65);flex:none}
#hint{color:#6b6b74;font-size:12px;letter-spacing:.05em;text-align:center}
@media(max-width:460px),(max-height:940px){
  #desk{padding:0;gap:0}
  #hint{display:none}
  #phone{transform-origin:center center}
}
@media(max-width:460px){
  #phone{width:100vw;height:100vh;border-radius:0;border:none;box-shadow:none}
}

/* ---------- 视口与页面 ---------- */
#vp{position:absolute;inset:0;overflow:hidden;perspective:1400px}
.scr{position:absolute;inset:0;background:#000;display:none;flex-direction:column;overflow:hidden}
.scr.on{display:flex}
/* WP 磁贴翻开：整页绕横轴翻页（翻页前后共用同一「倒下」姿态），被点磁贴自身绕纵轴翻开 */
.scr.enter{animation:flipIn .36s var(--ease) both;transform-origin:50% 62%;backface-visibility:hidden}
@keyframes flipIn{from{transform:rotateX(62deg) scale(.96);opacity:.25}to{transform:none;opacity:1}}
.scr.exit{animation:flipOut .28s var(--ease) both;transform-origin:50% 62%;backface-visibility:hidden}
@keyframes flipOut{to{transform:rotateX(62deg) scale(.96);opacity:0}}
.flipping{animation:tileFlip .3s var(--ease) both;transform-origin:50% 50%}
@keyframes tileFlip{from{transform:rotateY(0);opacity:1}to{transform:rotateY(88deg);opacity:.35}}
/* LED 音调表：骑在进度条正上方——等宽小方块柱，频谱推起对应数量的方块 */
.pop{animation:popk .38s var(--ease)}
@keyframes popk{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}
.scr.slideup{animation:slideUp .26s var(--ease) both}
@keyframes slideUp{from{transform:translateY(48px);opacity:0}to{transform:none;opacity:1}}
.scr.slidedown{animation:slideDown .24s var(--ease) both}
@keyframes slideDown{to{transform:translateY(48px);opacity:0}}

/* ---------- 排版 ---------- */
.label{font-size:12px;font-weight:600;letter-spacing:.12em;color:var(--accent);margin-bottom:10px}
.h-hero{font-size:44px;font-weight:300;line-height:1.15;letter-spacing:.01em}
.h-page{font-size:28px;font-weight:300;line-height:1.2}
.sub{font-size:12px;color:var(--t3)}
.sep{height:1px;background:var(--sep);border:none}
.ic{width:18px;height:18px;display:block}
.ic.lg{width:26px;height:26px}

/* ---------- 顶栏 / 底部应用栏 ---------- */
/* WP 交互法则：无顶部导航栏（内容即界面），返回 = 系统手势 */
.wpAppbar{flex:none;position:relative;margin-bottom:74px;padding:6px 12px;display:flex;align-items:center;min-height:44px}
.abRow{display:flex;align-items:center;gap:18px;flex:1;justify-content:flex-end}
.abIcon{width:34px;height:34px;border-radius:50%;border:1px solid var(--sep2);display:grid;place-items:center;color:var(--t1);flex:none}
.abIcon:active{border-color:var(--accent);color:var(--accent)}
.abMore{padding:8px 10px;color:var(--t2);font-weight:700;letter-spacing:.12em}
.abMore:active{color:var(--accent)}
.abMenu{position:absolute;right:12px;bottom:calc(100% + 2px);display:none;flex-direction:column;
  background:#000;border:1px solid var(--sep2);border-left:2px solid var(--accent);min-width:190px;z-index:20}
.abMenu.show{display:flex}
.abMenu button{display:block;width:100%;text-align:left;padding:13px 16px;font-size:15px;color:var(--t1);border-bottom:1px solid var(--sep)}
.abMenu button:last-child{border-bottom:none}
.abMenu button:active{color:var(--accent)}
/* 元数据缺失的默认占位（等待补全队列反向识别） */
.cvEmpty{border:1px solid var(--sep2);display:grid;place-items:center;color:var(--t3)}
.cvEmpty .ic{width:36%;height:36%}
.pickHint{padding:0 26px 10px;font-size:12px;color:var(--t3)}
.ghJson{font-size:11px;line-height:1.55;color:var(--t3);white-space:pre-wrap;background:rgba(255,255,255,.04);
  border-left:2px solid var(--sep2);padding:12px 14px;user-select:text;-webkit-user-select:text}
.iconbtn{padding:8px;color:var(--t2);border-radius:50%;transition:color .15s}
.iconbtn:active{color:var(--accent)}
.appbar{flex:none;position:relative;display:flex;align-items:center;justify-content:center;gap:34px;padding:12px 0 20px;
  background:rgba(0,0,0,.9);border-top:1px solid var(--sep);
  margin-bottom:74px} /* 抬到迷你条上方，避免重叠 */
.appbar .abSide{position:absolute;right:14px;display:flex;align-items:center;gap:14px}
.appbar .abIcon{width:30px;height:30px;border:none;color:var(--t2)}
.appbar .abMore{position:static;padding:6px}
.appbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--sep2);color:var(--t1);
  display:grid;place-items:center;transition:all .15s}
.appbtn:active{border-color:var(--accent);color:var(--accent)}
.appbtn.on{border-color:var(--accent);color:var(--accent)}

/* ---------- Hub 全景 ---------- */
#hubBg{position:absolute;top:0;left:0;height:100%;width:300%;pointer-events:none;z-index:0}
#hubBg .wm{position:absolute;top:110px;left:40px;font-size:190px;font-weight:300;letter-spacing:.04em;
  color:rgba(255,255,255,.045);white-space:nowrap}
#hubBg .diag{position:absolute;top:0;left:520px;width:1px;height:100%;background:rgba(255,255,255,.05)}
#hubBg .diagA{position:absolute;top:0;left:1100px;width:2px;height:100%;background:var(--accent);opacity:.28}
#hubTrack{position:relative;z-index:1;display:flex;flex:1;min-height:0;transition:transform .3s var(--ease)}
#hubTrack.drag{transition:none}
.hubPage{width:86%;flex:none;height:100%;overflow-y:auto;overflow-x:hidden;padding:58px 24px 40px;touch-action:pan-y}
.hubPage::-webkit-scrollbar{display:none}
.tileRow{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;margin-right:-24px;touch-action:pan-x}
.tileRow::-webkit-scrollbar{display:none}
.tile{flex:none;width:148px}
.tile .cv{width:148px;height:148px;display:grid;place-items:center;position:relative;overflow:hidden}
.tile .cv span{font-size:44px;font-weight:300;color:rgba(255,255,255,.85)}
.tile .cv .mini{position:absolute;right:6px;bottom:6px;display:flex;gap:3px}
.tile .cv .mini i{width:12px;height:12px;display:block}
.tile .tt{font-size:13px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--t1)}
.tile .ss{font-size:11px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bigrow{display:flex;align-items:baseline;gap:12px;padding:15px 2px;border-bottom:1px solid var(--sep);width:100%;text-align:left}
.bigrow .nm{font-size:24px;font-weight:300;color:var(--t1);flex:1}
.bigrow .ct{font-size:12px;color:var(--t3)}
.bigrow .ar{color:var(--t3);font-size:16px}
.bigrow:active .nm{color:var(--accent)}
.freeTile{border:1px solid var(--sep2);border-left:3px solid var(--accent);padding:26px 22px;margin-top:14px;width:100%;text-align:left}
.freeTile:active{background:rgba(255,255,255,.04)}
.freeTile .hh{font-size:34px;font-weight:300}
.freeTile .ss{margin-top:8px}
.npTileBox{margin-top:14px;display:flex;gap:16px;align-items:flex-start}
.npTileBox .cv{width:200px;height:200px;flex:none;display:grid;place-items:center;overflow:hidden}
.npTileBox .cv span{font-size:56px;font-weight:300;color:rgba(255,255,255,.85)}
.npMeta{flex:1;min-width:0;padding-top:8px}
.npMeta .tt{font-size:20px;font-weight:300;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.npMeta .ar{font-size:13px;color:var(--t2);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:2px;background:var(--sep2);margin-top:16px;position:relative}
.prog i{position:absolute;left:0;top:0;height:100%;background:var(--accent);transition:width .25s linear}
.ctrlRow{display:flex;gap:10px;margin-top:18px}
.chip{border:1px solid var(--sep2);padding:10px 16px;font-size:13px;color:var(--t1);display:flex;align-items:center;gap:8px}
.chip:active{border-color:var(--accent);color:var(--accent)}
.statRow{display:flex;align-items:center;padding:16px 2px;border-bottom:1px solid var(--sep);width:100%;text-align:left}
.statRow .nm{font-size:16px;flex:1}
.statRow .st{font-size:12px;color:var(--t3)}
.task{margin-top:14px}
.task .tn{font-size:13px;display:flex;justify-content:space-between;color:var(--t2)}

/* ---------- 收藏 pivot ---------- */
.pivotHead{flex:none;display:flex;align-items:baseline;gap:22px;padding:50px 24px 12px;border-bottom:1px solid var(--sep)}
.pvi{display:flex;align-items:baseline;gap:5px;color:var(--t3);position:relative;padding-bottom:8px;cursor:pointer}
.pvi .pvT{font-size:16px}
.pvi.cur{color:var(--t1)}
.pvi.cur .pvT{font-size:24px;font-weight:300}
.pvi .pvN{font-size:11px;color:var(--t3)}
.pvi.cur::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent)}
.pivotBody{flex:1;overflow-y:auto;padding:6px 24px 140px;position:relative}
.pivotBody::-webkit-scrollbar{display:none}
.grpL{font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--accent);padding:18px 0 6px}
.textlink{font-size:13px;color:var(--accent);display:inline-flex;align-items:center;gap:6px;
  padding:6px 2px;letter-spacing:.03em;transition:opacity .15s}
.textlink:active{opacity:.6}
.chipRow{display:flex;gap:10px;overflow-x:auto;padding:6px 0 2px;margin-right:-24px;touch-action:pan-x}
.chipRow::-webkit-scrollbar{display:none}
.chipRow .chip{flex:none}
.row{display:flex;align-items:center;gap:14px;padding:10px 2px;width:100%;text-align:left;border-bottom:1px solid var(--sep)}
.row:active{background:rgba(255,255,255,.03)}
.row .cv{width:48px;height:48px;flex:none;display:grid;place-items:center;overflow:hidden}
.row .cv span{font-size:20px;font-weight:300;color:rgba(255,255,255,.85)}
.row .mid{flex:1;min-width:0}
.row .tt{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ss{font-size:12px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.row .dur{font-size:12px;color:var(--t3);flex:none}
.row .heart{color:var(--accent);font-size:13px;flex:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 12px;padding-top:10px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 14px;padding-top:4px}
.gtile .cv{aspect-ratio:1;display:grid;place-items:center;overflow:hidden}
.gtile .cv span{font-size:34px;font-weight:300;color:rgba(255,255,255,.85)}
.gtile .tt{font-size:12.5px;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtile .ss{font-size:11px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.letterRail{position:absolute;right:2px;top:70px;bottom:150px;width:20px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:5;touch-action:none}
.letterRail span{font-size:9.5px;line-height:1.55;color:var(--t3);text-align:center;width:100%}
.letterRail:active span,.letterRail.drag span{color:var(--accent)}
#bigletter,#bigletterHub{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:64px;font-weight:300;
  color:var(--accent);pointer-events:none;opacity:0;transition:opacity .2s;z-index:9}
#bigletter.show,#bigletterHub.show{opacity:1}

/* ---------- 详情页 ---------- */
.detailBody{flex:1;overflow-y:auto;padding:54px 24px 20px}
.detailBody::-webkit-scrollbar{display:none}
.dHero{display:flex;gap:18px;align-items:flex-start;margin:10px 0 8px}
.dHero .cv{width:120px;height:120px;flex:none;display:grid;place-items:center;overflow:hidden}
.dHero .cv span{font-size:40px;font-weight:300;color:rgba(255,255,255,.85)}
.dMeta{flex:1;min-width:0;padding-top:6px}
.dMeta .tt{font-size:28px;font-weight:300;line-height:1.2}
.dMeta .ss{margin-top:8px}
.hRow{display:flex;gap:12px;overflow-x:auto;margin:16px -24px 0;padding:0 24px}
.hRow::-webkit-scrollbar{display:none}

/* ---------- 迷你条 ---------- */
#mini{position:absolute;left:10px;right:10px;bottom:18px;z-index:40;transition:transform .3s var(--ease),opacity .3s}
#vp.npOpen #mini{transform:translateY(140%);opacity:0;pointer-events:none}
#mini .bar{display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.92);border:1px solid var(--sep2);
  padding:9px 14px;position:relative;overflow:hidden;touch-action:pan-x}
#mini .bar::before{content:"";position:absolute;left:0;top:0;height:2px;background:var(--accent);transition:width .25s linear}
#mini .cv{width:38px;height:38px;flex:none;display:grid;place-items:center;overflow:hidden}
#mini .cv span{font-size:17px;font-weight:300;color:rgba(255,255,255,.85)}
#mini .mid{flex:1;min-width:0}
#mini .tt{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .ss{font-size:11px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
#mini .mbtn{color:var(--t2);padding:6px}
#mini .mbtn:active{color:var(--accent)}
#mini.empty .mid .tt{color:var(--t3)}

/* ---------- Now Playing ---------- */
#npHead{flex:none;display:flex;align-items:baseline;gap:20px;justify-content:center;padding:50px 24px 10px}
#npHead .pvi{padding-bottom:6px}
.npBody{flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column}
.npPane{position:absolute;inset:0;display:none;flex-direction:column}
.npPane.on{display:flex}
#npPlay{align-items:center;justify-content:center;padding:24px;touch-action:pan-y}
#npPlay .cv{width:280px;height:280px;display:grid;place-items:center;overflow:hidden;transition:opacity .2s}
#npPlay .cv.sw{opacity:0}
#npPlay .cv span{font-size:72px;font-weight:300;color:rgba(255,255,255,.85)}
#npPlay .tt{font-size:22px;font-weight:300;margin-top:26px;max-width:320px;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#npPlay .ar{font-size:14px;color:var(--t2);margin-top:8px}
.seekWrap{display:flex;align-items:center;gap:10px;margin-top:22px;width:340px}
.seekWrap .tm{font-size:11.5px;color:var(--t3);flex:none;min-width:32px;text-align:center}
#seek{flex:1;height:20px;display:flex;align-items:center;cursor:pointer;touch-action:none}
#seek .tr{width:100%;height:2px;background:var(--sep2);position:relative}
#seek .tr i{position:absolute;left:0;top:0;height:100%;background:var(--accent)}
#seek .tr b{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:var(--accent);
  transform:translate(-50%,-50%);opacity:0;transition:opacity .15s}
#seek.drag .tr b{opacity:1}
.ctrls{display:flex;align-items:center;gap:26px;margin-top:26px}
.ctrls .cbtn{color:var(--t2);padding:8px;transition:color .15s}
.ctrls .cbtn.on{color:var(--accent)}
.ctrls .cbtn:active{color:var(--accent)}
#playBig{width:64px;height:64px;border-radius:50%;border:1px solid var(--accent);color:var(--t1);
  display:grid;place-items:center}
#playBig:active{background:rgba(255,255,255,.06)}
#playBig .ic{width:24px;height:24px}
.subCtrls{display:flex;gap:26px;margin-top:18px;align-items:center}
#npLyrics{padding:40px 30px;overflow:hidden;position:relative}
#lyrTrack{transition:transform .35s var(--ease)}
.lyrLn{padding:11px 0;font-size:15px;color:rgba(255,255,255,.4);cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lyrLn.cur{font-size:20px;font-weight:300;color:var(--accent)}
#lyrOff{position:absolute;bottom:26px;left:0;right:0;display:none;justify-content:center;gap:12px}
#lyrOff.show{display:flex}
#lyrOff .chip{font-size:12px;padding:8px 14px}
#npQueue{padding:6px 0 30px}
.qHead{display:flex;align-items:center;padding:10px 24px}
.qHead .nm{flex:1;font-size:14px;color:var(--t2)}
.qHead button{font-size:12.5px;color:var(--t3);padding:6px}
.qHead button:active{color:var(--accent)}
#qList{flex:1;overflow-y:auto}
#qList::-webkit-scrollbar{display:none}
#qList .row.cur .tt{color:var(--accent)}

/* ---------- 搜索（内容式页面，无顶栏） ---------- */
.srTop{flex:none;padding:54px 24px 6px}
#qInput{width:100%;background:none;border:none;outline:none;border-bottom:1px solid var(--sep2);
  color:var(--t1);font-size:24px;font-weight:300;padding:6px 0 10px;
  font-family:inherit;user-select:text;-webkit-user-select:text}
#qInput:focus{border-bottom-color:var(--accent)}
#qInput::placeholder{color:var(--t3)}
.scope{display:flex;gap:10px;padding:0 24px 10px}
.scope .chip{font-size:12px;padding:6px 12px;color:var(--t3)}
.scope .chip.on{color:var(--accent);border-color:var(--accent)}
#srBody{flex:1;overflow-y:auto;padding:4px 24px 140px}
#srBody::-webkit-scrollbar{display:none}
.recentWrap{display:flex;flex-wrap:wrap;gap:10px;padding:14px 0}
.recentWrap .chip{font-size:13px;padding:8px 14px}

/* ---------- 收集 / 设置 ---------- */
.pBody{flex:1;overflow-y:auto;padding:54px 24px 40px}
.pBody::-webkit-scrollbar{display:none}
.pasteBox{display:flex;gap:10px;margin:14px 0}
.pasteBox input{flex:1;background:none;border:1px solid var(--sep2);color:var(--t1);padding:11px 12px;
  font:inherit;font-size:13px;outline:none;user-select:text;-webkit-user-select:text}
.pasteBox input:focus{border-color:var(--accent)}
.pasteBox input::placeholder{color:var(--t3)}
.dots{display:flex;flex-wrap:wrap;gap:14px;padding:16px 0 8px}
.dot{width:40px;height:40px;border-radius:50%;border:2px solid transparent;position:relative}
.dot.on{border-color:#fff}
.dot span{position:absolute;inset:0;border-radius:50%;margin:auto;width:30px;height:30px}
.folderRow{display:flex;align-items:center;gap:12px;padding:14px 2px;border-bottom:1px solid var(--sep)}
.folderRow .pth{flex:1;font-size:14px}
.folderRow .ct{font-size:12px;color:var(--t3)}

/* ---------- 上下文菜单 / Toast ---------- */
#ctx{position:absolute;inset:0;z-index:60;display:none}
#ctx.show{display:block}
#ctx .dim{position:absolute;inset:0;background:rgba(0,0,0,.55);animation:fadeIn .2s both}
@keyframes fadeIn{from{opacity:0}}
#ctx .sheet{position:absolute;left:0;right:0;bottom:0;background:#000;border-top:2px solid var(--accent);
  animation:sheetUp .2s var(--ease) both;padding:6px 0 26px}
@keyframes sheetUp{from{transform:translateY(100%)}}
#ctx .mi{display:block;width:100%;text-align:left;padding:17px 26px;font-size:18px;font-weight:300;
  color:var(--t1);border-bottom:1px solid var(--sep)}
#ctx .mi:last-child{border-bottom:none;color:var(--t3)}
#ctx .mi:active{color:var(--accent)}
#ctx .ct{padding:16px 26px 6px;font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--accent)}
/* WP toast：顶部整宽横条，从顶边滑入（应用名 + 消息），直角无气泡 */
#toast{position:absolute;left:0;right:0;top:0;z-index:85;pointer-events:none;
  transform:translateY(-100%);opacity:0;transition:transform .3s var(--ease),opacity .3s}
#toast.show{transform:translateY(0);opacity:1}
#toast .bar{display:flex;flex-direction:column;background:rgba(0,0,0,.96);

const artTracks=aid=>artAlbums(aid).flatMap(al=>albTracks(al.id));
function hue(str){let x=0;for(const c of str)x=(x*31+c.charCodeAt(0))>>>0;return x%360}
/* 封面入口：元数据缺失的专辑显示默认占位，等待补全队列反向识别 */
function alCov(al,size,seed){
  if(al&&al.partial)return `<div class="cv cvEmpty" style="width:${size}px;height:${size}px">${ICON.note}</div>`;
  return covHTML(al?al.title:(seed||'?'),size);
}
/* 程序化封面艺术（演示用）：四种画风，按专辑名确定性生成；正式版走封面链 */
function covHTML(seed,size){
  const H=hue(seed),H2=(H+45)%360,V=hue(seed+'v')%4,uid='cx'+(H%361)+'_'+V;
  const base=`<linearGradient id="${uid}" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="hsl(${H},62%,52%)"/><stop offset="1" stop-color="hsl(${H2},72%,22%)"/></linearGradient>`;
  let art='';
  if(V===0){ /* 黑胶 */
    art=`<circle cx="74" cy="82" r="58" fill="hsl(${H},40%,13%)" opacity=".88"/>
      ${[47,39,31].map(r=>`<circle cx="74" cy="82" r="${r}" fill="none" stroke="hsl(${H2},60%,74%)" stroke-opacity=".3"/>`).join('')}
      <circle cx="74" cy="82" r="16" fill="hsl(${H2},70%,58%)"/>
      <circle cx="74" cy="82" r="4" fill="#000" opacity=".55"/>`;
  }else if(V===1){ /* 声波 */
    art=`<path d="M0 94 Q 40 62 80 94 T 160 94 V160 H0 Z" fill="hsl(${H2},70%,30%)" opacity=".82"/>
      <path d="M0 114 Q 40 84 80 114 T 160 114 V160 H0 Z" fill="hsl(${H},72%,46%)" opacity=".82"/>
      <circle cx="118" cy="40" r="21" fill="hsl(${H2},72%,74%)" opacity=".92"/>`;
  }else if(V===2){ /* 圆环 */
    art=`<circle cx="54" cy="56" r="38" fill="none" stroke="hsl(${H2},72%,68%)" stroke-width="10" opacity=".5"/>
      <circle cx="98" cy="98" r="32" fill="none" stroke="hsl(${H},82%,80%)" stroke-width="8" opacity=".62"/>
      <circle cx="122" cy="42" r="13" fill="hsl(${H2},72%,62%)"/>`;
  }else{ /* 斜切 */
    art=`<path d="M0 0 L112 0 L42 160 L0 160 Z" fill="hsl(${H2},70%,32%)" opacity=".85"/>
      <path d="M120 0 L160 0 L160 118 Z" fill="hsl(${H},82%,64%)" opacity=".72"/>
      <rect x="20" y="120" width="48" height="6" rx="3" fill="#fff" opacity=".65"/>`;
  }
  return `<div class="cv" style="width:${size}px;height:${size}px">
    <svg viewBox="0 0 160 160" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%;display:block">
      <defs>${base}</defs><rect width="160" height="160" fill="url(#${uid})"/>${art}</svg></div>`;
}
function covCSS(seed){const h=hue(seed);return `background:linear-gradient(135deg,hsl(${h},62%,50%),hsl(${(h+45)%360},72%,24%))`}
const initOf=py=>{const c=(py||'a').trim()[0];return /[a-z]/i.test(c)?c.toUpperCase():'#'};
function groupBy(items,keyFn){const m=new Map();
  for(const it of items){const k=keyFn(it);if(!m.has(k))m.set(k,[]);m.get(k).push(it)}
  return [...m.entries()].sort((a,b)=>a[0]===b[0]?0:(a[0]==='#'?1:b[0]==='#'?-1:a[0]<b[0]?-1:1))}
function toast(t,title){const el=$('#toast');$('#toastTxt').textContent=t;
  $('#toastTt').textContent=title||'I A MUSIC';el.classList.add('show');
  clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),2600)}
function matchQ(q,...fields){q=q.toLowerCase();return fields.some(f=>f&&(f.toLowerCase().includes(q)||f.replace(/\s/g,'').toLowerCase().includes(q)))}
/* 动效确认：即时可视操作不打断（无文字通知），仅弹跳动画 */
function popEl(el){if(!el)return;el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}

}

  S.cur=t;S.posMs=0;S.playing=true;
  t.pc=(t.pc||0)+1;
  S.history=S.history||[];S.history=[t.id,...(S.history.filter(id=>id!==t.id))].slice(0,50);

  if($('#scr-hub').classList.contains('on'))renderHubPage1();}
function shuffled(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}
function nextTrack(auto){if(!S.queue.length)return;
  if(S.shuffle&&S.queue.length>1){let n;do{n=Math.floor(Math.random()*S.queue.length)}while(n===S.qi);S.qi=n}
  else{S.qi++;if(S.qi>=S.queue.length){if(S.repeat==='all'||!auto)S.qi=0;else{S.playing=false;S.posMs=S.cur.d;updateLive();return}}}
  startCur()}
function prevTrack(){if(!S.cur)return;
  if(S.posMs>3000){S.posMs=0;updateLive();return}
  S.qi=Math.max(0,S.qi-1);startCur()}
function insertNext(t){if(!S.cur){playQueue([t],0);return}
  S.queue.splice(S.qi+1,0,t);toast('已插播：下一首播放','队列')}
function tick(){
  if(S.playing&&S.cur){S.posMs+=250;
    if(S.posMs>=S.cur.d){
      if(S.repeat==='one'){S.posMs=0;startCur()}
      else nextTrack(true);
    }
  }
  for(const tk of EXTRACT_TASKS){tk.p=Math.min(100,tk.p+Math.random()*1.2);
    if(tk.p>=100&&!tk.done){tk.done=true;
      /* 所有音乐统一入库：提取结果与本地文件同等对待（同目录、同曲库、不标记来源） */
      const title=tk.name.replace(/【[^】]*】/g,'').trim()||tk.name;
      const al={id:'x'+Date.now(),artist:'ext',title,year:2026,py:title,added:99,partial:true};
      DB.albums.unshift(al);
      const tid=1000+Math.floor(Math.random()*9e5);
      DB.tracks.push({id:tid,al:al.id,no:1,t:title,d:200000+Math.floor(Math.random()*150000),py:title,pi:'',pc:0,enrich:true});
      /* 元数据缺失 → 进入补全队列：从音频内容反向识别歌手/封面/歌词 */
      S.enrich.push({title,alId:al.id,trackId:tid,p:0});
      EXTRACT_TASKS=EXTRACT_TASKS.filter(x=>x!==tk);
      toast(`已入库：${title}`,'提取完成');
      if($('#scr-settings').classList.contains('on'))renderSettings();
      if(detail&&(detail.type==='collect'||detail.type==='extract'))openDetailSilent(detail.type,detail.type);
      if($('#scr-hub').classList.contains('on'))renderHub();
    }}
  /* 元数据补全队列：音频指纹 → 在线匹配 → 封面/歌词 → 写入标签 */
  for(const e of S.enrich){e.p=Math.min(100,e.p+Math.random()*0.8);
    if(e.p>=100&&!e.done){e.done=true;
      const EN=[['暮色电台','musediantai','msdt'],['玻璃海豚','bolihaitun','blht'],['Loop 光斑','loopguangban','loop']];
      const [nm,py,pi]=EN[(Math.random()*EN.length)|0];
      let ar=DB.artists.find(a=>a.name===nm);
      if(!ar)DB.artists.push({id:'n'+Math.random().toString(36).slice(2,7),name:nm,py,pi});
      const al=DB.albums.find(a=>a.id===e.alId);
      if(al){al.partial=false;al.artist=DB.artists.find(a=>a.name===nm).id;al.year=2026}
      const t=DB.tracks.find(x=>x.id===e.trackId);if(t)t.enrich=false;
      S.enrich=S.enrich.filter(x=>x!==e);
      toast(`${e.title} · ${nm}`,'元数据补全完成');
      if($('#scr-settings').classList.contains('on'))renderSettings();
      if(detail&&(detail.type==='collect'||detail.type==='extract'))openDetailSilent(detail.type,detail.type);
      if($('#scr-hub').classList.contains('on'))renderHub();
    }}
  if(detail&&detail.type==='extract'){
    EXTRACT_TASKS.forEach((t,i)=>{const el=document.querySelector(`#detailBody [data-ti="${i}"]`);if(el){
      el.querySelector('.prog i').style.width=t.p+'%';
      el.querySelector('.pp').textContent=`${t.src} · ${Math.round(t.p)}%`;}});
    S.enrich.forEach((e,i)=>{const el=document.querySelector(`#detailBody [data-ei="${i}"]`);if(el){
      const ST=['音频指纹','在线匹配','封面','歌词','写入标签'];const st=Math.min(4,Math.floor(e.p/20));
      el.querySelector('.prog i').style.width=e.p+'%';
      el.querySelector('.pp').textContent=`${ST[st]} · ${Math.round(e.p)}%`;}});
  }
  updateLive();
}
function updateLive(){
  if(S.cur){
    const r=S.cur.d?S.posMs/S.cur.d*100:0;
    const mp=$('#miniProg');if(mp)mp.style.width=r+'%';
    if($('#scr-np').classList.contains('on')){
      const sp=$('#npPos');if(sp)sp.textContent=fmt(S.posMs);
      if(!seekDrag){const pw=$('#seekFill');if(pw)pw.style.width=r+'%';const pd=$('#seekDot');if(pd)pd.style.left=r+'%'}
      renderLyricCursor();
    }
    if($('#scr-hub').classList.contains('on')){const hp=$('#hubProg');if(hp)hp.style.width=r+'%'}
  }
}

function go(id,slide){
  const from=curScr(),to=$('#'+id);

function wireHubRail(){
  const rail=document.getElementById('hubRail');if(!rail)return;
  const page=rail.closest('.hubPage');
  const grps=[...page.querySelectorAll('.grp[data-hub]')];if(!grps.length)return;
  rail.innerHTML=grps.map(g=>`<span data-hl="${g.dataset.l}">${g.dataset.l}</span>`).join('');
  let drag=false;
  const big=document.getElementById('bigletterHub');
  const pick=e=>{
    const spans=[...rail.querySelectorAll('span')];if(!spans.length)return;
    const r=rail.getBoundingClientRect();
    const i=Math.max(0,Math.min(spans.length-1,Math.floor((e.clientY-r.top)/r.height*spans.length)));
    const L=spans[i].dataset.hl;
    const g=grps.find(x=>x.dataset.l===L);
    if(g)page.scrollTop=g.offsetTop-6;
    big.textContent=L;big.classList.add('show');
  };
  rail.addEventListener('pointerdown',e=>{drag=true;rail.setPointerCapture(e.pointerId);pick(e)});
  rail.addEventListener('pointermove',e=>{if(drag)pick(e)});
  const end=()=>{drag=false;setTimeout(()=>big.classList.remove('show'),250)};
  rail.addEventListener('pointerup',end);rail.addEventListener('pointercancel',end);
}

/* Hub 横滑（左缘 28px 留给返回手势） */
(function(){
  const scr=$('#scr-hub'),tr=$('#hubTrack');
  let sx=0,sy=0,pid=null,moved=false,base=0;
  scr.addEventListener('pointerdown',e=>{
    if(e.clientX<=28)return;
    if(e.target.closest('[data-act]')&&e.pointerType==='mouse')return;
    pid=e.pointerId;sx=e.clientX;sy=e.clientY;base=-hubPage*hubW();moved=false;
    tr.classList.add('drag');
  });
  scr.addEventListener('pointermove',e=>{
    if(pid===null||e.pointerId!==pid)return;
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(!moved&&Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy))moved=true;
    if(moved){hubX=Math.max(-(HUB_PAGES-1)*hubW(),Math.min(0,base+dx));applyHub()}
  });
  const up=e=>{
    if(pid===null)return;pid=null;tr.classList.remove('drag');
    if(moved){
      const dx=e.clientX-sx;
      if(dx<-60&&hubPage<HUB_PAGES-1)hubPage++;
      else if(dx>60&&hubPage>0)hubPage--;
      hubX=-hubPage*hubW();applyHub();
    }
    setTimeout(()=>{moved=false},50);
  };
  scr.addEventListener('pointerup',up);scr.addEventListener('pointercancel',up);
  // 拖动后拦截点击
  scr.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault()}},true);
})();

/* 字母速查轨 */
(function(){
  const rail=$('#colRail'),big=$('#bigletter');let dragging=false;
  function pick(e){
    const spans=[...rail.querySelectorAll('span')];if(!spans.length)return;
    const r=rail.getBoundingClientRect();
    const i=Math.max(0,Math.min(spans.length-1,Math.floor((e.clientY-r.top)/r.height*spans.length)));
    const L=spans[i].dataset.l;
    const body=$('#colBody');
    const g=body.querySelector(`.grp[data-l="${L}"]`);
    if(g)body.scrollTop=g.offsetTop-body.offsetTop;
    big.textContent=L;big.classList.add('show');rail.classList.add('drag');
  }
  rail.addEventListener('pointerdown',e=>{dragging=true;rail.setPointerCapture(e.pointerId);pick(e)});
  rail.addEventListener('pointermove',e=>{if(dragging)pick(e)});
  const end=()=>{dragging=false;rail.classList.remove('drag');setTimeout(()=>big.classList.remove('show'),250)};
  rail.addEventListener('pointerup',end);rail.addEventListener('pointercancel',end);
})();

/* 连续动效：被点元素飞升为详情标题 */
function fly(srcEl,getDst){
  try{
    if(!srcEl)return;
    const txt=srcEl.dataset.fly||srcEl.textContent.trim().slice(0,20);
    const r=srcEl.getBoundingClientRect();
    setTimeout(()=>{
      const dst=getDst&&getDst();if(!dst)return;
      const d=dst.getBoundingClientRect();
      const el=document.createElement('div');
      el.textContent=txt;
      el.style.cssText=`position:fixed;z-index:99;font-size:20px;font-weight:300;color:var(--accent);
        pointer-events:none;white-space:nowrap;transition:all .28s cubic-bezier(.22,.9,.26,1);
        left:${r.left}px;top:${r.top}px;line-height:1.2`;
      document.body.appendChild(el);
      requestAnimationFrame(()=>{
        el.style.left=(d.left-6)+'px';el.style.top=(d.top-10)+'px';el.style.fontSize='26px';el.style.opacity='.9';
      });
      setTimeout(()=>el.remove(),320);
    },60);
  }catch(e){}
}

/* 播放屏整页横滑 = 切歌；歌词/队列屏横滑 = 换屏 */
(function(){

  body.addEventListener('pointerdown',e=>{
    if(e.clientX<=28)return;

  body.addEventListener('pointerup',e=>{
    if(!down)return;down=false;

    const dx=e.clientX-sx,dy=e.clientY-sy;
    /* 播放屏下滑退出（与左缘右滑等价的另一手势） */
    if(dy>70&&Math.abs(dy)>Math.abs(dx)*1.4)closeNP();
  });
  body.addEventListener('pointermove',e=>{
    if(moved)return;
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(Math.abs(dx)>64&&Math.abs(dx)>Math.abs(dy)*1.6){
      moved=true;

        const cv=$('#npPlay .cv');if(cv)cv.classList.add('sw');
        setTimeout(()=>{dx<0?nextTrack():prevTrack();setTimeout(()=>{const c=$('#npPlay .cv');if(c)c.classList.remove('sw')},80)},120);
      }else{
        S.npTab=Math.max(0,Math.min(2,S.npTab+(dx<0?1:-1)));
        setNpPane();
        $('#npHead').innerHTML=['播放','歌词','队列'].map((n,i)=>
          `<div class="pvi ${S.npTab===i?'cur':''}" data-act="np-tab" data-i="${i}"><span class="pvT">${n}</span></div>`).join('');
      }
    }});
  body.addEventListener('pointerup',()=>setTimeout(()=>moved=false,60));
})();
/* seek 拖拽（#seek 由 NP 渲染后生成，用委托绑定） */
(function(){
  let drag=false;
  const ratio=e=>{
    const tr=document.querySelector('#seek .tr');if(!tr)return 0;
    const r=tr.getBoundingClientRect();
    return Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
  };
  const paint=e=>{
    const p=ratio(e);
    const f=$('#seekFill');if(f)f.style.width=p*100+'%';
    const d=$('#seekDot');if(d)d.style.left=p*100+'%';
    const pos=$('#npPos');if(pos&&S.cur)pos.textContent=fmt(p*S.cur.d);
  };
  document.addEventListener('pointerdown',e=>{
    const seek=e.target.closest('#seek');
    if(!seek||!S.cur)return;
    drag=true;seekDrag=true;seek.classList.add('drag');paint(e);
  },true);
  document.addEventListener('pointermove',e=>{if(drag)paint(e)},true);
  document.addEventListener('pointerup',e=>{
    if(!drag)return;
    drag=false;seekDrag=false;
    const seek=$('#seek');if(seek)seek.classList.remove('drag');
    if(S.cur){S.posMs=ratio(e)*S.cur.d;updateLive()}
  },true);
})();
let seekDrag=false;

(function(){

/* ================= 上下文菜单（WP 式长按） ================= */
function openCtx(kind,id){
  const sheet=$('#ctxSheet');let items=[],title='';
  if(kind==='track'){
    const t=track(id);title=t.t;
    items=[
      ['播放',()=>{playQueue(albTracks(t.al),albTracks(t.al).findIndex(x=>x.id===t.id))}],
      ['下一首播放',()=>insertNext(t)],
      [S.liked.has(t.id)?'取消喜欢':'喜欢 ♥',()=>{S.liked.has(t.id)?S.liked.delete(t.id):S.liked.add(t.id);save();refreshRows()}],
      ['加到歌单…',()=>playlistMenu('track',t)],
      ['查看专辑',()=>{closeCtx();openDetail('album',t.al)}],
    ];
  }else if(kind==='album'){
    const al=album(id);title=al.title;
    items=[
      ['播放专辑',()=>playQueue(albTracks(al.id),0)],
      ['随机播放',()=>playQueue(shuffled(albTracks(al.id)),0)],
      [S.likedAlb.has(al.id)?'取消喜欢专辑':'喜欢专辑 ♥',()=>{S.likedAlb.has(al.id)?S.likedAlb.delete(al.id):S.likedAlb.add(al.id);save();refreshRows()}],
      ['查看艺人',()=>{closeCtx();openDetail('artist',al.artist)}],
    ];
  }else if(kind==='artist'){
    const a=artist(id);title=a.name;
    items=[
      ['播放全部',()=>playQueue(shuffled(artTracks(a.id)),0)],
      ['查看主页',()=>{closeCtx();openDetail('artist',a.id)}],
    ];
  }else if(kind==='playlist'){
    const p=DB.playlists.find(x=>x.id===id);title=p.name;
    items=[
      ['播放歌单',()=>playQueue(p.tracks.map(track).filter(Boolean),0)],
      ['随机播放',()=>playQueue(shuffled(p.tracks.map(track).filter(Boolean)),0)],
    ];
  }
  sheet.innerHTML=`<div class="ct">${esc(title)}</div>`+
    items.map(([n,f],i)=>`<button class="mi" data-ctx="${i}">${n}</button>`).join('')+
    `<button class="mi" data-act="ctx-close">取消</button>`;
  sheet.querySelectorAll('[data-ctx]').forEach(btn=>btn.addEventListener('click',()=>{
    items[+btn.dataset.ctx][1]();closeCtx();
  }));
  $('#ctx').classList.add('show');
}

function playlistMenu(kind,t){
  const sheet=$('#ctxSheet');

/* ============================================================
   iA-Music 设计原型 · 全局动作分发 · 手势 · 键盘 · 启动
   拆分自单文件原型；加载顺序见 index.html
   ============================================================ */
/* ================= 全局动作分发 ================= */
document.addEventListener('click',e=>{
  if(!e.target.closest('.abMore'))closeAbMenus();
  const el=e.target.closest('[data-act]');
  if(!el)return;
  if(lpEl&&lpEl.dataset.lpDone){e.stopPropagation();e.preventDefault();return}
  const act=el.dataset.act,id=el.dataset.id;
  // WP 磁贴翻开：被点磁贴先绕纵轴翻开，页面随后绕横轴翻入
  const flyEl=e.target.closest('[data-fly]');
  if(flyEl)flyEl.classList.add('flipping');
  if(act==='ab-toggle'){const m=document.getElementById(el.dataset.m);
    if(m)m.classList.toggle('show');return}
  switch(act){
    case 'open-col':go('scr-col');break;
    case 'open-github':go('scr-github');break;
    case 'gh-fetch':{const inp=document.getElementById('ghUrl');
      gh.url=(inp&&inp.value?inp.value:GH_SAMPLE_URL).trim()||GH_SAMPLE_URL;
      toast('拉取中…','GitHub');
      setTimeout(()=>{gh.data=GH_SAMPLE;gh.step='preview';renderGitHub()},700);break}
    case 'gh-back':gh.step='input';renderGitHub();break;
    case 'gh-import':{const d=gh.data;if(!d)break;
      DB.playlists.push({id:'gh'+Date.now(),name:d.name,py:'',pi:'',tracks:[],pending:d.tracks.length});
      d.tracks.forEach(t=>EXTRACT_TASKS.push({name:`${t.title} · ${t.artist}`,src:t.source,p:4}));
      gh={step:'input',data:null,url:GH_SAMPLE_URL};
      back();toast(`已导入「${d.name}」· ${d.tracks.length} 首进入提取队列`,'歌单');
      renderHub();break}
    case 'col-open':colTabKey=el.dataset.tab||'artists';go('scr-colList');break;
    case 'open-search':go('scr-search');break;
    case 'open-settings':go('scr-settings');break;
    case 'open-np':openNP();break;
    case 'close-np':closeNP();break;
    case 'back':back();break;
    case 'col-tab':colTabKey=el.dataset.k;renderCol();break;
    case 'np-tab':S.npTab=+el.dataset.i;setNpPane();
      $('#npHead').innerHTML=['播放','歌词','队列'].map((n,i)=>
        `<div class="pvi ${S.npTab===i?'cur':''}" data-act="np-tab" data-i="${i}"><span class="pvT">${n}</span></div>`).join('');break;
    case 'np-more':npMore();break;
    case 'open-detail':openDetail(el.dataset.type,id,el);break;
    case 'play-track':{const t=track(+id);
      playQueue(albTracks(t.al),albTracks(t.al).findIndex(x=>x.id===t.id));break}
    case 'play-album':playQueue(albTracks(id),0);break;
    case 'shuffle-album':playQueue(shuffled(albTracks(id)),0);break;
    case 'play-artist':playQueue(artTracks(id).length?artTracks(id):[],0);break;
    case 'shuffle-artist':playQueue(shuffled(artTracks(id)),0);break;
    case 'play-playlist':{const p=DB.playlists.find(x=>x.id===id);playQueue(p.tracks.map(track).filter(Boolean),0);break}
    case 'shuffle-playlist':{const p=DB.playlists.find(x=>x.id===id);playQueue(shuffled(p.tracks.map(track).filter(Boolean)),0);break}
    case 'shuffle-genre':playQueue(shuffled(DB.albums.filter(a=>a.g===id).flatMap(al=>albTracks(al.id))),0);break;
    case 'toggle-play':togglePlay();break;
    case 'next':nextTrack();break;
    case 'prev':prevTrack();break;
    case 'shuffle':S.shuffle=!S.shuffle;
      if($('#scr-np').classList.contains('on')){renderNPPlay();popEl(document.querySelector('[data-act="shuffle"]'))}break;
    case 'repeat':S.repeat=S.repeat==='off'?'all':S.repeat==='all'?'one':'off';
      if($('#scr-np').classList.contains('on')){renderNPPlay();popEl(document.getElementById('repBtn'))}break;
    case 'like-cur':if(S.cur){S.liked.has(S.cur.id)?S.liked.delete(S.cur.id):S.liked.add(S.cur.id);save();
      renderNPPlay();popEl(document.querySelector('[data-act="like-cur"]'));renderMini()}break;
    case 'np-addto':if(S.cur){playlistMenu('track',S.cur);$('#ctx').classList.add('show')}break;
    case 'like-album':{const on=S.likedAlb.has(id);on?S.likedAlb.delete(id):S.likedAlb.add(id);save();
      el.classList.toggle('on',!on);el.innerHTML=(!on)?ICON.heartFill:ICON.heart;popEl(el);break}
    case 'free-play':playQueue(shuffled(DB.tracks),0,'随缘听歌 · 全曲库随机');break;
    case 'radio-like':playQueue(shuffled(DB.tracks.filter(t=>S.liked.has(t.id))),0,
      S.liked.size?'喜欢电台 · 从红心出发':'先去喜欢几首歌吧');break;
    case 'radio-top':playQueue(shuffled([...DB.tracks].sort((a,b)=>(b.pc||0)-(a.pc||0)).slice(0,20)),0,'常听电台 · Top 20');break;
    case 'radio-new':{const als=[...DB.albums].sort((a,b)=>(b.added||0)-(a.added||0)).slice(0,3);
      playQueue(shuffled(als.flatMap(al=>albTracks(al.id))),0,'最近添加电台');break}
    case 'radio-hist':{const hs=(S.history||[]).map(track).filter(Boolean);
      playQueue(hs.length?hs:[],0,hs.length?'历史回放':'还没有历史');break}
    case 'lyr-seek':if(S.cur){S.posMs=+el.dataset.t+S.lyricOff;updateLive();renderLyricCursor(true)}break;
    case 'lyr-off':{S.lyricOff=+el.dataset.v;toast(S.lyricOff?`歌词偏移 ${S.lyricOff>0?'+':''}${S.lyricOff/1000}s`:'偏移已重置');
      renderLyricCursor(true);break}
    case 'q-jump':S.qi=+el.dataset.i;startCur();break;
    case 'q-remove':{const i=+el.dataset.i;S.queue.splice(i,1);
      if(i<S.qi)S.qi--;renderQueue();break}
    case 'q-clear':S.queue=[];S.qi=-1;S.playing=false;S.cur=null;renderQueue();renderMini();break;
    case 'ctx-close':closeCtx();break;
    case 'ctx-back':{const t=S.cur;openCtx('track',t?t.id:0);break}
    case 'set-accent':setAccent(el.dataset.c);renderSettings();break;
    case 'login':{const k=el.dataset.k;S.logins[k]=!S.logins[k];save();
      if($('#scr-settings').classList.contains('on'))renderSettings();
      if(detail&&(detail.type==='collect'||detail.type==='extract'))openDetailSilent(detail.type,detail.type);
      if($('#scr-hub').classList.contains('on'))renderHub();break}
    case 'paste-extract':{const inp=$('#linkIn');const v=(inp.value||'').trim();
      if(!v){toast('先粘贴一个链接');break}
      EXTRACT_TASKS.push({name:v.slice(0,28),src:'链接',p:4});
      inp.value='';renderSettings();
      if(detail&&(detail.type==='collect'||detail.type==='extract'))openDetailSilent(detail.type,detail.type);
      toast('已加入提取队列','收集');break}
    case 'recent':$('#qInput').value=el.dataset.q;renderSearch(el.dataset.q);break;
    case 'pick-dir':dirPicker();break;
    case 'demo':toast('此功能在正式版实现 · 原型仅演示','提示');break;
    case 'ob-replay':S.obStep=0;renderOnboard();break;
    case 'ob-accent':setAccent(el.dataset.c);renderOnboard();break;
    case 'ob-next':if(S.obStep>=1){$('#onboard').classList.remove('show');localStorage.setItem('ia_ob','1')}
      else{S.obStep++;renderOnboard()}break;
    case 'ob-done':$('#onboard').classList.remove('show');localStorage.setItem('ia_ob','1');
      toast('欢迎来到 黑胶金时代','WELCOME');break;
  }
});

function fit(){
  const ph=$('#phone');
  if(window.innerWidth<=460){ph.style.transform='';return}
  const s=Math.min(1,(window.innerHeight-60)/922,(window.innerWidth-40)/412);
  ph.style.transform=s<1?`scale(${s})`:'';
}
window.addEventListener('resize',fit);

/* 返回 = 左缘右滑（Android 手势即 WP 硬件返回键的等位） */
(function(){
  let sx=0,sy=0,armed=false;
  document.addEventListener('pointerdown',e=>{
    armed=false;
    if(e.clientX<=26&&S.stack.length>1){sx=e.clientX;sy=e.clientY;armed=true}
  },true);
  document.addEventListener('pointermove',e=>{
    if(!armed)return;
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(dx>16&&Math.abs(dx)>Math.abs(dy)*1.3){armed=false;back()}
  },true);
})();
/* 桌面端键盘返回 */
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='Escape'||e.key==='Backspace'){
    if(S.stack.length>1){e.preventDefault();back()}
  }
});

function boot(){
  document.documentElement.style.setProperty('--accent',S.accent);
  renderAppbars();
  renderHub();renderMini();fit();
  if(!localStorage.getItem('ia_ob')){S.obStep=0;renderOnboard()}
}
try{boot()}catch(e){window.__bootErr=String(e&&e.stack||e)}
  </script>
