name: ia_music
description: "iA-Music — 本地优先的个人音乐库。"
publish_to: 'none'

version: 1.0.0+31

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any # 版本跟随 flutter_localizations（SDK 锁定）

  # 状态管理：全应用唯一状态方案（服务暴露 + UI 状态的唯一通道）
  flutter_riverpod: ^3.0.0

  # 持久层：drift 唯一持久层 + bundled sqlite（FTS5 内建）
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  sqlite3: ^3.7.1
  path_provider: ^2.1.4
  package_info_plus: ^10.2.2 # 安装包版本元数据（关于页展示；pubspec version 为唯一事实源）

  # 领域依赖
  audio_metadata_reader: ^1.8.1
  pinyin: 3.3.0
  crypto: ^3.0.7
  chromaprint: # FFI：AcoustID 音频指纹（vendored——pub 包 C++ 源码缺失，仓库内补全 chromaprint 1.5.1 src）
    path: third_party/chromaprint-ffi
  permission_handler: ^11.3.1
  image_picker: ^1.1.2 # 歌单封面：系统相册选取（Android Photo Picker，无需存储权限）
  qr_flutter: ^4.1.0 # B 站扫码登录的二维码渲染（纯 Dart）
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  quickjs_engine: ^0.1.7
  file_picker: ^13.4.1 # 歌词导入：编辑歌曲信息页选 .lrc/.txt（SAF，无需存储权限）

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  drift_dev: ^2.35.1
  build_runner: ^2.4.15
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# 启动图标：assets/icon 下的 Zune/Metro 层叠磁贴 + 双音符 → 全密度 mipmap + 自适应图标
flutter_launcher_icons:
  image_path: "assets/icon/icon_1024.png"
  android: true
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/icon_foreground_1024.png"

# 原生构建链：
# * sqlite3：Android 目标与测试宿主(Windows)均从仓库内置源码编译
#   （native/sqlite3/sqlite3.c），FTS5 内建。
# * 播放：AndroidX Media3/ExoPlayer（just_audio）；无 mpv / 无自编译播放器。
hooks:
  user_defines:
    sqlite3:
      source:
        windows: source
        android: source
        default: sqlite3
      path: native/sqlite3/sqlite3.c

flutter:
  assets:
    - plugins/bilibili.plugin.js
    - plugins/youtube.plugin.js
    - plugins/jamendo.plugin.js
    - plugins/internetarchive.plugin.js
    - plugins/audius.plugin.js
    - plugins/librivox.plugin.js
    - plugins/podcast.plugin.js
    - plugins/subsonic.plugin.js
  generate: true
  uses-material-design: true
