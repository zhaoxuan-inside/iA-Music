name: ia_music
description: "iA-Music — 本地优先的个人音乐库。"
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any # 版本跟随 flutter_localizations（SDK 锁定）

  # 状态管理：全应用唯一状态方案（服务暴露 + UI 状态的唯一通道）
  flutter_riverpod: ^3.0.0

  # 持久层：drift 唯一持久层 + bundled sqlite（FTS5 内建）
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  sqlite3: ^3.7.1
  path_provider: ^2.1.4

  # 领域依赖
  audio_metadata_reader: ^1.8.1
  pinyin: 3.3.0
  crypto: ^3.0.7
  mpv_audio_kit: 0.5.1 # 锁定：与 vendored libmpv 及适配器语义已验证对齐（0.5.3 变更未验证）
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.35.1
  build_runner: ^2.4.15
  flutter_lints: ^6.0.0

# 原生构建链（自 v1 趟平的路径原样保留）：
# * sqlite3：Android 目标与测试宿主(Windows)均从仓库内置源码编译
#   （native/sqlite3/sqlite3.c），FTS5 内建。
# * mpv_audio_kit 运行库随仓库提供（packaging/mpv，Android arm64 +
#   Windows 宿主 dll——后者仅供本机 flutter test 的宿主构建），
#   避免构建时访问 GitHub release。
hooks:
  user_defines:
    mpv_audio_kit:
      libmpv: packaging/mpv
    sqlite3:
      source:
        windows: source
        android: source
        default: sqlite3
      path: native/sqlite3/sqlite3.c

flutter:
  generate: true
  uses-material-design: true
