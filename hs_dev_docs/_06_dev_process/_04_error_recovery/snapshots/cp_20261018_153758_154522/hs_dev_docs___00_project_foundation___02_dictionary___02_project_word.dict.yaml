# ==============================================================================
# 项目术语与命名统一词典 (Project Term & Naming Dictionary)
# 作用：建立全局统一语言（Ubiquitous Language）与单一事实源（Single Source of Truth），
#       消除同义词重复定义、语义漂移与事件/动作/时间戳混淆（如 update vs updated vs updated_at）。
# ==============================================================================

# 1. 语法与词态矩阵规则 (Lifecycle Grammar & Part-of-Speech Matrix)
grammar_rules:
  command:
    part_of_speech: "动词原形 (Imperative Verb)"
    convention: "snake_case 或 camelCase"
    example: "update_order / cancel_payment"
    description: "表示发起一个动作或指令（请求尚未发生，可能被拒绝）"
  domain_event:
    part_of_speech: "名词.过去分词 (Past Participle) 或 PascalCase"
    convention: "<entity>.<action_past_tense> (如 order.updated / user.created)"
    example: "order.updated / payment.succeeded / OrderUpdated"
    description: "表示领域内已经发生的事实（只读广播，严禁用动词原形如 order.update，严禁用时间戳如 updated_at）"
  property_timestamp:
    part_of_speech: "名词或过去分词 + _at"
    convention: "<action_past_tense>_at"
    example: "created_at / updated_at / deleted_at"
    description: "实体的时间戳属性，严禁用作动作名或事件名"
  payload_action:
    part_of_speech: "全大写动名词或动词 (Upper Snake Case)"
    convention: "CREATE / UPDATE / DELETE"
    example: "action: 'UPDATE'"
    description: "变更日志、CDC 或 Webhook Payload 内部的操作类型枚举"

# 2. 内置生命周期标准词汇 (Standard Lifecycle Built-in Terms)
lifecycle_terms:
  - concept: "创建 / 登记"
    command: "create"
    event: "created"
    timestamp: "created_at"
    payload_action: "CREATE"
    forbidden_alias: ["make", "add_new", "build_entity"]

  - concept: "更新 / 修改"
    command: "update"
    event: "updated"
    timestamp: "updated_at"
    payload_action: "UPDATE"
    forbidden_alias: ["modify", "change", "alter", "renew", "on_update"]

  - concept: "删除 / 注销"
    command: "delete"
    event: "deleted"
    timestamp: "deleted_at"
    payload_action: "DELETE"
    forbidden_alias: ["remove", "destroy", "drop_entity"]

  - concept: "发布 / 生效"
    command: "publish"
    event: "published"
    timestamp: "published_at"
    payload_action: "PUBLISH"
    forbidden_alias: ["release", "send_out"]

# 3. 业务领域实体词典 (Domain Model & Business Terms) — iA Music
terms:
  - term: "音乐仓库"
    en_name: "music_repository"
    abbr: "repo"
    scope: "domain_model"
    desc: "用户指定并由应用扫描的本地音乐文件夹（可多个）；与『提取保存目录』同属仓库体系"
    forbidden_alias: ["music_folder", "lib_dir", "scan_root"]

  - term: "曲目"
    en_name: "track"
    abbr: "trk"
    scope: "domain_model"
    desc: "曲库中的一条音乐记录（元数据实体）；与物理文件（file）严格区分，记录移除不删除文件"
    forbidden_alias: ["song_record", "music_item", "audio_entry"]

  - term: "曲库"
    en_name: "library"
    abbr: "lib"
    scope: "domain_model"
    desc: "全部曲目记录的集合（跨仓库）；对外统一称『本地曲库』"
    forbidden_alias: ["song_pool", "music_bank", "track_set"]

  - term: "歌单"
    en_name: "playlist"
    abbr: "pl"
    scope: "domain_model"
    desc: "用户自建/导入的曲目有序集合；红心歌单与历史为系统内置歌单"
    forbidden_alias: ["song_list", "fav_folder", "setlist"]

  - term: "红心"
    en_name: "like"
    abbr: "lk"
    scope: "domain_model"
    desc: "用户对曲目的喜欢标记；聚合视图为『我喜欢的音乐』；UI 语义色 #FF5C7A"
    forbidden_alias: ["favorite", "star", "collect"]

  - term: "音乐空间"
    en_name: "music_space"
    abbr: "ms"
    scope: "ui"
    desc: "应用首页/一级 Tab（DEC-006 更名，原名『发现』）；承载随机卡/最近入库/我的歌单"
    forbidden_alias: ["discover", "explore", "home_feed"]

  - term: "随机"
    en_name: "shuffle"
    abbr: "shf"
    scope: "domain_model"
    desc: "音乐空间的本地随机播放模式（复刻豆瓣 FM 私人兆赫心智，DEC-006 更名）；随机池=全库−少播名单，单轮不重复；页面形态=轮盘页（DEC-006 D6-7）"
    forbidden_alias: ["private_mhz", "mhz", "random_radio", "shuffle_fm", "fm_mode"]

  - term: "轮盘页"
    en_name: "shuffle_wheel"
    abbr: "shw"
    scope: "ui"
    desc: "「随机」页的页面形态（DEC-006 D6-7）：歌曲海报卡唱片轮盘、当前卡焦点、仅上滑/播完自动切歌；路由 shuffle"
    forbidden_alias: ["mhz_page", "radio_wheel", "turntable_page", "card_fan"]

  - term: "少播名单"
    en_name: "less_play_list"
    abbr: "lpl"
    scope: "domain_model"
    desc: "被『垃圾桶』加入的曲目集合，随机播放时排除；可在设置中清空恢复"
    forbidden_alias: ["blacklist", "dislike_pool", "ban_list"]

  - term: "提取"
    en_name: "extraction"
    abbr: "ext"
    scope: "method"
    desc: "由分享链接解析并下载音频、规整元数据后入库的完整动作"
    forbidden_alias: ["download", "grab", "crawl", "capture"]

  - term: "移除（记录）"
    en_name: "unlink"
    abbr: "unk"
    scope: "method"
    desc: "仅将曲目从曲库/歌单移除记录，绝不物理删除用户音频文件；与『删除文件』严格区分"
    forbidden_alias: ["remove_track", "delete_from_lib"]

  - term: "歌词资产"
    en_name: "lyrics_asset"
    abbr: "lyr"
    scope: "domain_model"
    desc: "以同目录同名 .lrc 为最终载体（含手动粘贴、偏移调整、AI 生成结果）；不写回音频文件"
    forbidden_alias: ["lyric_file", "lrc_data", "subtitle"]

  - term: "歌词生成"
    en_name: "lyrics_generation"
    abbr: "lyr_gen"
    scope: "method"
    desc: "使用本地小模型对音频做人声识别生成带时间轴歌词（串行队列、纯本地推理）"
    forbidden_alias: ["asr_task", "transcribe", "lyric_ai", "speech2lyric"]

  - term: "均衡器"
    en_name: "equalizer"
    abbr: "eq"
    scope: "domain_model"
    desc: "5 段（60Hz~14kHz）±12dB 音效调节；预设含默认/流行/摇滚/古典/爵士/低音增强/自定义"
    forbidden_alias: ["sound_effect", "audio_tuning", "eq_board"]

  - term: "同步通道"
    en_name: "sync_channel"
    abbr: "ch"
    scope: "domain_model"
    desc: "用户自有存储接入点（WebDAV/OneDrive/Google Drive/GitHub；百度网盘已移除，DEC-008）；MVP 单活跃通道"
    forbidden_alias: ["sync_provider", "backup_drive", "cloud_link"]

  - term: "墓碑"
    en_name: "tombstone"
    abbr: "tmb"
    scope: "domain_model"
    desc: "删除传播标记：同步时移除其他设备的记录，但云端音频文件与本地物理文件均保留"
    forbidden_alias: ["delete_mark", "gravestone", "trash_flag"]

  - term: "冲突副本"
    en_name: "conflict_copy"
    abbr: "cc"
    scope: "domain_model"
    desc: "同步冲突时保留的败者版本（新修改者胜），可在同步中心查看/清理"
    forbidden_alias: ["conflict_file", "merge_copy", "dup_version"]

  - term: "仓库相对路径"
    en_name: "repo_relative_path"
    abbr: "rrp"
    scope: "domain_model"
    desc: "曲目文件相对仓库根的路径，作为跨设备匹配同一文件的依据（与内容哈希联合校验）"
    forbidden_alias: ["relative_url", "rel_path_key"]

  - term: "文件缺失"
    en_name: "missing_file"
    abbr: "miss"
    scope: "domain_model"
    desc: "曲目记录存在但物理文件不在仓库的状态；行内灰显并支持『定位文件』恢复"
    forbidden_alias: ["file_lost", "broken_track", "not_found_song"]
