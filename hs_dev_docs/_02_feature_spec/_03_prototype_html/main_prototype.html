<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iA Music — 主原型预览 (Prototype Viewer)</title>
<style>
  :root{
    --canvas:#0A0B0D; --surface:#16181C; --surface2:#1F2228; --line:rgba(255,255,255,.08);
    --text:#F5F6F7; --text2:#9BA1A8; --accent:#4BE0A3; --heart:#FF5C7A; --error:#FF6B6B; --warn:#F0B232;
    --r-card:12px; --r-cover:8px; --r-big:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#060708;color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;display:flex;flex-direction:column;overflow:hidden;font-size:14px}
  .tn{font-variant-numeric:tabular-nums}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

  /* ===== 工具栏 ===== */
  .toolbar{background:#0d0f12;border-bottom:1px solid var(--line);padding:8px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;flex-shrink:0;user-select:none;z-index:10}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px}
  .brand i{width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block}
  .seg{display:flex;background:#14171b;border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
  .seg button{padding:4px 10px;border-radius:7px;font-size:12px;color:var(--text2);white-space:nowrap}
  .seg button.on{background:#23272d;color:#fff;font-weight:600}
  .seg.state button.on{background:rgba(75,224,163,.16);color:var(--accent)}
  .tb-label{font-size:11px;color:var(--text2)}
  .tb-spacer{flex:1}
  .spec-toggle{padding:4px 10px;border:1px solid var(--line);border-radius:7px;background:#14171b;font-size:12px;color:#c8ccd2}

  /* ===== 舞台与设备 ===== */
  .stage{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto;background:radial-gradient(1200px 600px at 50% 0%,#0b0d10 0%,#060708 60%)}
  .device{position:relative;background:var(--canvas);color:var(--text);border:1px solid #23272d;border-radius:22px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6);transition:width .25s,height .25s;display:flex}
  .device.m{border-radius:30px;border-width:6px;border-color:#1a1d22}
  .device .spec{display:none;position:absolute;z-index:50;background:rgba(240,178,50,.92);color:#141414;font:10px/1.4 ui-monospace,monospace;padding:1px 5px;border-radius:4px;pointer-events:none;white-space:nowrap}
  .device.showspec .spec{display:block}

  /* ===== 壳层布局 ===== */
  .app{display:flex;flex:1;min-height:0;position:relative}
  .app.mobile{flex-direction:column;width:100%}
  .app.desktop{display:grid;grid-template-columns:240px 1fr;grid-template-rows:1fr 72px}
  .content{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative}
  .app.desktop .content{grid-column:2;grid-row:1}
  .app.immersive .content{grid-column:1/-1;grid-row:1/-1}

  /* 桌面左栏 */
  .nav{display:none}
  .app.desktop .nav{display:flex;flex-direction:column;grid-column:1;grid-row:1/-1;background:#0d0f12;border-right:1px solid var(--line);padding:18px 12px}
  .nav .logo{font-weight:700;font-size:16px;padding:4px 10px 18px;display:flex;align-items:center;gap:8px}
  .nav .logo i{width:10px;height:10px;border-radius:50%;background:var(--accent)}
  .nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;font-size:13px;color:#c8ccd2;text-decoration:none;margin-bottom:2px}
  .nav a.on{background:rgba(75,224,163,.12);color:var(--accent);font-weight:600}
  .nav .sect{font-size:11px;color:var(--text2);padding:16px 12px 6px;letter-spacing:.05em}
  .nav .pl{padding:7px 12px;font-size:12.5px;color:#aab0b7;border-radius:8px}
  .nav .foot{margin-top:auto;font-size:12.5px;color:#c8ccd2;padding:9px 12px}

  /* 底 Tab（移动 · 复刻豆瓣 FM：仅图标、无文字） */
  .tabbar{display:flex;height:56px;background:#0A0B0D;border-top:1px solid rgba(255,255,255,.05);flex-shrink:0}
  .app.desktop .tabbar{display:none}
  .tabbar button{flex:1;display:flex;align-items:center;justify-content:center;color:#6E747C}
  .tabbar button.on{color:#F0F2F4}
  .tabbar .ic{display:flex}
  .tabbar .ic svg{width:23px;height:23px}
  .tabbar .safe{height:0}

  /* 迷你播放条（悬浮胶囊 + 黑胶唱片） */
  .mini{display:flex;align-items:center;gap:11px;height:52px;margin:0 10px 8px;padding:0 14px;background:rgba(26,28,32,.96);border:1px solid rgba(255,255,255,.06);border-radius:999px;cursor:pointer;flex-shrink:0;backdrop-filter:blur(16px)}
  .mini .vinyl{width:36px;height:36px;border-radius:50%;flex-shrink:0;background:#0B0C0E;border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;animation:vspin 9s linear infinite}
  .mini .vinyl i{width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,#274a5e,#4a2b56)}
  .mini .t{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mini .t b{font-weight:600}
  .mini .t span{color:#B9BEC5;font-size:12.5px}
  .mini .ops{display:flex;gap:16px;color:#D5D9DE;align-items:center}
  .mini .ops svg{width:18px;height:18px}
  @keyframes vspin{to{transform:rotate(360deg)}}

  /* 桌面底播放条 */
  .playerbar{display:none}
  .app.desktop .playerbar{display:flex;align-items:center;gap:16px;grid-column:2;grid-row:2;background:#0d0f12;border-top:1px solid var(--line);padding:0 20px}
  .playerbar .c{width:44px;height:44px;border-radius:8px}
  .playerbar .meta{width:180px;min-width:0}
  .playerbar .meta b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .playerbar .meta span{font-size:11px;color:var(--text2)}
  .playerbar .ctl{display:flex;align-items:center;gap:16px;font-size:17px}
  .playerbar .ctl svg{width:20px;height:20px;display:block}
  .playerbar .pg{flex:1;display:flex;align-items:center;gap:10px;font-size:11px;color:var(--text2)}

  /* ===== 通用组件 ===== */
  .h1{font-size:22px;font-weight:650;letter-spacing:-.01em}
  .h2{font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px}
  .h2 small{color:var(--text2);font-weight:400;font-size:12px}
  .page{padding:18px 20px 24px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:10px;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface2)}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#08110c}
  .btn.sm{min-height:36px;padding:0 12px;font-size:12.5px;border-radius:8px}
  .btn.danger{color:var(--error)}
  .chip{display:inline-block;padding:5px 12px;border-radius:999px;font-size:12px;color:#c8ccd2;background:var(--surface2);border:1px solid var(--line);margin-right:6px}
  .chip.on{background:rgba(75,224,163,.16);border-color:rgba(75,224,163,.4);color:var(--accent);font-weight:600}
  .cover{border-radius:var(--r-cover);background:linear-gradient(135deg,#2b3550,#5b3a62);position:relative;flex-shrink:0;overflow:hidden}
  .cover::after{content:attr(data-l);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:rgba(255,255,255,.55);font-size:34%}
  .row{display:flex;align-items:center;gap:12px;padding:9px 2px;border-radius:10px}
  .row:hover{background:rgba(255,255,255,.04)}
  .row .info{flex:1;min-width:0}
  .row .info b{font-size:15px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .info span{font-size:12.5px;color:var(--text2)}
  .row .dur{font-size:12px;color:var(--text2)}
  .row.miss{opacity:.4}
  .badge{font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.1);color:#c8ccd2}
  .heart{color:var(--text2);font-size:17px}
  .heart.on{color:var(--heart)}
  .hr{height:1px;background:var(--line);margin:14px 0}
  .muted{color:var(--text2);font-size:12.5px}
  .center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:70%;gap:12px;padding:30px}
  .center .big{font-size:19px;font-weight:650}
  .prog{height:3px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden;flex:1}
  .prog i{display:block;height:100%;background:var(--accent);border-radius:2px}
  .prog.thin{height:2px}
  .skeleton{background:linear-gradient(90deg,#1c1f24,#262a31,#1c1f24);background-size:200% 100%;animation:sk 1.6s infinite;border-radius:8px}
  @keyframes sk{0%{background-position:0 0}100%{background-position:-200% 0}}
  .toast{margin:10px 20px;padding:10px 14px;border-radius:10px;background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.4);color:#ffc9c9;font-size:13px}
  .note{margin:10px 20px;padding:10px 14px;border-radius:10px;background:rgba(240,178,50,.1);border:1px solid rgba(240,178,50,.35);color:#f5d9a0;font-size:12.5px}
  .flat{margin-top:8px;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
  .flat.soft{background:var(--surface2)}
  .two{display:flex;gap:10px;align-items:center}

  /* ===== 音乐空间页（随机卡 · 复刻豆瓣精选卡） ===== */
  .mhz{position:relative;border-radius:20px;overflow:hidden;padding:16px 18px;min-height:150px;display:flex;align-items:center;gap:14px;cursor:pointer;background:linear-gradient(105deg,#37CE97 0%,#2198B4 55%,#1E6E9D 100%)}
  .mhz .art{width:78px;height:78px;border-radius:12px;flex-shrink:0;background:linear-gradient(135deg,#0F2E24,#123243);display:flex;align-items:center;justify-content:center;font-size:26px;color:rgba(255,255,255,.85);box-shadow:0 8px 20px rgba(0,0,0,.25)}
  .mhz .txt{flex:1;min-width:0}
  .mhz h3{font-size:21px;font-weight:700;color:#fff}
  .mhz p{font-size:12.5px;color:rgba(255,255,255,.82);margin-top:2px}
  .mwave{display:flex;gap:3px;align-items:flex-end;height:20px;margin-top:8px}
  .mwave i{width:3px;border-radius:2px;background:rgba(255,255,255,.8);transform-origin:bottom;animation:wv 1.1s ease-in-out infinite}
  .mwave.paused i{animation-play-state:paused}
  @keyframes wv{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
  .mhz .disc{width:52px;height:52px;border-radius:50%;flex-shrink:0;background:#fff;color:#0B2018;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
  .mhz .disc svg{width:20px;height:20px}
  .hscroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px}
  .hcard{width:112px;flex-shrink:0}
  .hcard .cover{width:112px;height:112px}
  .hcard b{display:block;font-size:12.5px;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .hcard span{font-size:11px;color:var(--text2)}

  /* ===== 我的页 ===== */
  .plrow{display:flex;align-items:center;gap:12px;padding:10px 2px}
  .plrow .cover{width:48px;height:48px;border-radius:10px}
  .plrow b{font-size:14.5px;display:block}
  .plrow span{font-size:12px;color:var(--text2)}
  .plrow .more{margin-left:auto;color:var(--text2)}

  /* ===== 我的页（顶部图标 / 图卡统计）===== */
  .mtop{display:flex;align-items:center;justify-content:space-between}
  .iconbtn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#D5D9DE}
  .iconbtn svg{width:22px;height:22px}
  .mstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .mstat{position:relative;border-radius:14px;min-height:104px;overflow:hidden}
  .mstat .ov{position:absolute;left:0;right:0;bottom:0;padding:20px 10px 9px;display:flex;align-items:center;gap:5px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.6));font-size:12px;color:#E8EAED}
  .mstat .ov svg{width:13px;height:13px;flex-shrink:0}
  .mstat .ov .lb{color:#C9CED4}
  .mstat .ov b{margin-left:2px;font-weight:700;color:#fff}
  .plbtn{position:absolute;right:8px;bottom:8px;width:34px;height:34px;border-radius:50%;background:#fff;color:#0B0C0E;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.35)}
  .plbtn svg{width:15px;height:15px;margin-left:2px}
  .plus{width:48px;height:48px;border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--accent);flex-shrink:0}

  /* ===== 搜索页（胶囊输入 + 分类浏览）===== */
  .searchpill{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:999px;padding:12px 16px;margin-top:12px}
  .searchpill svg{width:20px;height:20px;color:var(--accent);flex-shrink:0}
  .searchpill .q{flex:1;min-width:0;font-size:14px;color:var(--text)}
  .searchpill .clr{color:var(--text2);font-size:13px}
  .ggrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .gcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 14px 14px;min-height:118px;display:flex;flex-direction:column;justify-content:space-between}
  .gcard .gname{font-weight:800;font-size:23px;line-height:1.05;letter-spacing:.01em}
  .gcard .gtag{align-self:flex-start;background:#0B0C0E;color:#9BA1A8;border-radius:999px;padding:4px 11px;font-size:11.5px}

  /* ===== 播放页 ===== */
  .immers{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;background:#0a0b0d}
  .immers .bg{position:absolute;inset:-60px;background:linear-gradient(150deg,#274a3e 0%,#1d2a44 45%,#3c2547 100%);filter:blur(70px) saturate(1.1);transition:.4s}
  .immers .scape{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.72))}
  .immers .inner{position:relative;display:flex;flex-direction:column;flex:1;padding:14px 24px 26px;align-items:center}
  .ptop{width:100%;display:flex;align-items:center;justify-content:space-between;height:44px;color:#e8eaed}
  .ptop>span{cursor:pointer;display:flex;align-items:center}
  .ptop>span svg{width:22px;height:22px}
  .ptop .t{font-size:13px;color:rgba(255,255,255,.75)}
  .filmwrap{width:min(92%,340px);margin-top:12px;background:#0D0F11;border-radius:18px;padding:10px 10px 0;box-shadow:0 24px 60px rgba(0,0,0,.55)}
  .filmwrap.bare{background:transparent;border-radius:0;padding:0;box-shadow:none}
  .filmshot{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden}
  .filmshot::after{content:attr(data-l);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:72px;color:rgba(255,255,255,.28)}
  .tags{position:absolute;right:10px;bottom:10px;display:flex;gap:6px;z-index:2}
  .tags span{font-size:11px;padding:4px 12px;border-radius:999px;background:var(--accent);color:#07130D;font-weight:600}
  .perf{display:flex;gap:8px;justify-content:center;padding:8px 4px}
  .perf i{width:7px;height:11px;border-radius:2px;background:rgba(255,255,255,.16)}
  .pmeta{width:100%;text-align:left;margin-top:22px}
  .pmeta h2{font-size:23px;font-weight:650}
  .pmeta .titlerow{display:flex;align-items:center;justify-content:space-between;gap:14px}
  .pmeta .titlerow .heart{font-size:21px;cursor:pointer}
  .pmeta .arow{display:flex;align-items:center;gap:10px;margin-top:12px}
  .pmeta .av{width:32px;height:32px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,#4a2b56,#274a5e);border:1px solid rgba(255,255,255,.18)}
  .pmeta .nm{font-size:15px;color:rgba(255,255,255,.9)}
  .pmeta .rside{margin-left:auto;color:#C7CBD1;font-size:19px;cursor:pointer;letter-spacing:2px;line-height:1}
  .lprev{margin-top:14px;font-size:13.5px;line-height:1.85;color:rgba(255,255,255,.38);cursor:pointer}
  .lprev span{display:block}
  .pprog{width:100%;display:flex;align-items:center;gap:10px;margin-top:auto;font-size:11.5px;color:rgba(255,255,255,.7)}
  .prog.seek{overflow:visible;background:rgba(255,255,255,.22)}
  .prog.seek i{position:relative}
  .prog.seek i::after{content:"";position:absolute;right:-5px;top:50%;transform:translateY(-50%);width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.45)}
  .tri{display:flex;align-items:center;justify-content:space-around;width:100%;margin-top:20px;color:#fff}
  .tri .side{font-size:24px;opacity:.95;cursor:pointer}
  .tri .side svg{width:26px;height:26px;display:block}
  .tri .play{cursor:pointer;display:flex;align-items:center;justify-content:center}
  .tri .play svg{width:30px;height:30px;display:block}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:#171a1f;border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:16px 18px 22px;box-shadow:0 -20px 50px rgba(0,0,0,.6)}
  .sheet h4{font-size:14px;font-weight:600;display:flex;justify-content:space-between;margin-bottom:8px}
  .sheet .row{padding:8px 2px}
  .lyr{display:flex;flex-direction:column;gap:18px;width:100%;margin-top:28px;padding:0 6px}
  .lyr p{font-size:17px;line-height:1.5;color:rgba(255,255,255,.42);font-weight:500;text-align:center;transition:.2s}
  .lyr p.on{color:var(--accent);font-weight:650;font-size:18px}
  .lyr p .tr{display:block;font-size:14px;color:rgba(255,255,255,.4);margin-top:2px}
  .offset{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:20px;color:rgba(255,255,255,.8);font-size:13px}
  .offset .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.16);min-height:34px;padding:0 12px}

  /* ===== 随机页（经典「兆赫」页 · 胶片选帧 · 仅上滑切歌）===== */
  .shuf{position:relative;flex:1;display:flex;flex-direction:column;z-index:1}
  .shuf .topnav{display:flex;align-items:center;gap:34px;padding:48px 22px 4px;font-size:15px;color:#9BA1A8}
  .shuf .topnav .srch{display:flex;cursor:pointer;color:#D5D9DE}
  .shuf .topnav .srch svg{width:22px;height:22px}
  .shuf .topnav .tab{position:relative;padding:4px 2px;cursor:pointer}
  .shuf .topnav .tab.on{color:#F5F6F7;font-weight:600}
  .shuf .topnav .tab.on::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:-3px;width:18px;height:3px;border-radius:2px;background:var(--accent)}
  .sdeck{position:relative;flex:1;min-height:600px;margin-top:8px;touch-action:none;cursor:grab;transition:transform .5s cubic-bezier(.3,.75,.3,1);transform-origin:-143.8px 464px}
  .sdeck:active{cursor:grabbing}
  .pcard{position:absolute;left:0;top:0;width:240px;height:240px;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 26px 56px rgba(0,0,0,.5);transition:transform .55s cubic-bezier(.32,.72,.28,1),height .55s cubic-bezier(.32,.72,.28,1),filter .55s,opacity .55s;transform-origin:50% 50%}
  .pcard .pl{font-weight:700;font-size:64px;color:rgba(255,255,255,.42);text-shadow:0 2px 16px rgba(0,0,0,.2)}
  .pcard>.tags{opacity:0;transition:opacity .4s}
  .pcard.slot-cur>.tags{opacity:1}
  .slot-out{transform:translate(-202.4px,-34px) rotate(-20.5deg);opacity:0;z-index:5}
  .slot-p2{transform:translate(-119.3px,118.9px) rotate(-15.4deg);z-index:10}
  .slot-p1{transform:translate(-89.7px,134.2px) rotate(-10.2deg);z-index:20}
  .slot-in{transform:translate(-163.4px,796.6px) rotate(19.5deg);opacity:0;z-index:22}
  .slot-nxt2{transform:translate(-157.7px,642px) rotate(9.5deg);z-index:23}
  .slot-nxt{transform:translate(-91.2px,476.2px) rotate(9.5deg);z-index:25}
  .slot-p1,.slot-p2,.slot-nxt,.slot-nxt2{height:174px}
  .slot-cur{transform:translate(-38.3px,257.1px) rotate(-.7deg);z-index:40}
  .sinfo3{position:absolute;right:28px;top:380px;width:128px;z-index:60}
  .sinfo3 .station{font-size:12.5px;color:#C7CBD1}
  .sinfo3 h2{font-size:21px;font-weight:650;margin-top:28px;color:#F5F6F7}
  .sinfo3 p{font-size:13px;color:rgba(255,255,255,.55);margin-top:6px}
  .sinfo3 .sprog{height:5px;border-radius:3px;background:rgba(255,255,255,.16);margin-top:111px;width:100%;overflow:hidden}
  .sinfo3 .sprog i{display:block;height:100%;background:var(--accent);transition:width .4s}
  .sinfo3 .stime{font-size:11px;color:rgba(255,255,255,.5);display:inline-block;margin-top:6px}
  .sctl{position:absolute;left:0;right:0;bottom:-6px;z-index:60;display:flex;align-items:center;justify-content:flex-end;gap:34px;padding:0 40px 6px}
  .sctl .side{color:#C8CCD2;cursor:pointer}
  .sctl .side svg{width:26px;height:26px;display:block}
  .sctl .pausebtn{width:34px;height:34px;margin-left:10px;color:var(--accent);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .sctl .pausebtn svg{width:26px;height:26px}
  .sctl .heart{font-size:30px;cursor:pointer}
  .shuf .hint{position:absolute;left:0;right:0;bottom:46px;z-index:60;text-align:center;font-size:12px;color:rgba(255,255,255,.45)}

  /* ===== 提取页 ===== */
  .textarea{width:100%;min-height:96px;background:var(--surface);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:12px;font:inherit;resize:none;outline:none}
  .textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(75,224,163,.2)}
  .taskrow{display:flex;align-items:center;gap:12px;padding:10px 0}
  .taskrow .info{flex:1;min-width:0}
  .taskrow .info b{font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .taskrow .info span{font-size:11.5px;color:var(--text2)}
  .qbadge{font-size:11px;color:var(--accent)}

  /* ===== 同步页 ===== */
  .chan{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:10px}
  .chan .ic{width:38px;height:38px;border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:17px}
  .chan b{font-size:13.5px;display:block}
  .chan span{font-size:11.5px;color:var(--text2)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0}

  /* ===== 设置页 ===== */
  .srow{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line)}
  .srow .ic{width:32px;height:32px;border-radius:9px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:15px}
  .srow b{font-size:14.5px;font-weight:500;flex:1}
  .srow span{font-size:12.5px;color:var(--text2)}
  .srow .ch{color:#555b63}
  .stitle{font-size:12px;color:var(--text2);margin:20px 0 2px;letter-spacing:.04em}

  /* ===== 白天模式（双主题 · DEC-005） ===== */
  [data-theme="light"]{--canvas:#F6F7F9;--surface:#FFFFFF;--surface2:#ECEEF1;--line:rgba(0,0,0,.08);--text:#17191C;--text2:#6E747C;--accent:#17A566;--heart:#E14D68;--error:#D64545}
  [data-theme="light"].device{box-shadow:0 30px 80px rgba(20,24,32,.25)}
  [data-theme="light"] .nav{background:#F2F3F6;border-right-color:#E3E5E9}
  [data-theme="light"] .nav a{color:#40454C}
  [data-theme="light"] .nav a.on{background:rgba(23,165,102,.12)}
  [data-theme="light"] .nav .pl{color:#5A616A}
  [data-theme="light"] .nav .foot{color:#40454C}
  [data-theme="light"] .tabbar{background:#FFFFFF;border-top-color:#E3E5E9}
  [data-theme="light"] .tabbar button{color:#8A9099}
  [data-theme="light"] .tabbar button.on{color:#17191C}
  [data-theme="light"] .mini{background:#FFFFFF;border-color:rgba(0,0,0,.08)}
  [data-theme="light"] .mini .ops{color:#4A5058}
  [data-theme="light"] .mini .t span{color:#6E747C}
  [data-theme="light"] .iconbtn{color:#40454C}
  [data-theme="light"] .searchpill{background:#ECEEF1}
  [data-theme="light"] .gcard{background:#FFFFFF}
  [data-theme="light"] .playerbar{background:#F2F3F6;border-top-color:#E3E5E9}
  [data-theme="light"] .chip{color:#4A5058;background:#FFFFFF}
  [data-theme="light"] .chip.on{background:rgba(23,165,102,.12);border-color:rgba(23,165,102,.35)}
  [data-theme="light"] .badge{background:rgba(0,0,0,.06);color:#4A5058}
  [data-theme="light"] .row:hover{background:rgba(0,0,0,.035)}
  [data-theme="light"] .prog{background:rgba(0,0,0,.1)}
  [data-theme="light"] .skeleton{background:linear-gradient(90deg,#E8EAEE,#F3F4F7,#E8EAEE)}
  [data-theme="light"] .toast{background:rgba(255,107,107,.08);color:#A32B39;border-color:rgba(255,107,107,.35)}
  [data-theme="light"] .note{background:rgba(240,178,50,.12);color:#8A5A08;border-color:rgba(240,178,50,.35)}
  /* 沉浸页浅色氛围（胶片帧保持深色实体，DEC-005 D5-4） */
  [data-theme="light"] .immers{background:#F6F7F9}
  [data-theme="light"] .immers .bg{filter:blur(70px) saturate(.85) brightness(1.6)}
  [data-theme="light"] .immers .scape{background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(246,247,249,.86))}
  [data-theme="light"] .ptop{color:#17191C}
  [data-theme="light"] .ptop .t{color:rgba(0,0,0,.55)}
  [data-theme="light"] .filmwrap{box-shadow:0 24px 60px rgba(16,20,28,.25)}
  [data-theme="light"] .pmeta .nm{color:rgba(0,0,0,.62)}
  [data-theme="light"] .pmeta .rside{color:rgba(0,0,0,.55)}
  [data-theme="light"] .lprev{color:rgba(0,0,0,.4)}
  [data-theme="light"] .pprog{color:rgba(0,0,0,.55)}
  [data-theme="light"] .tri{color:#17191C}
  [data-theme="light"] .sheet{background:#FFFFFF;box-shadow:0 -20px 50px rgba(15,18,24,.16)}
  [data-theme="light"] .lyr p{color:rgba(0,0,0,.42)}
  [data-theme="light"] .lyr p .tr{color:rgba(0,0,0,.38)}
  [data-theme="light"] .offset{color:rgba(0,0,0,.72)}
  [data-theme="light"] .offset .btn{background:rgba(0,0,0,.05);border-color:rgba(0,0,0,.12)}
  [data-theme="light"] .prog.seek{background:rgba(0,0,0,.15)}
  [data-theme="light"] .prog.seek i::after{background:#14171C;box-shadow:0 1px 6px rgba(0,0,0,.25)}
  [data-theme="light"] .shuf .topnav{color:#6E747C}
  [data-theme="light"] .shuf .topnav .srch{color:#3a3f46}
  [data-theme="light"] .shuf .topnav .tab.on{color:#17191C}
  [data-theme="light"] .sinfo3 .station{color:#3a3f46}
  [data-theme="light"] .sinfo3 h2{color:#17191C}
  [data-theme="light"] .sinfo3 p{color:rgba(0,0,0,.5)}
  [data-theme="light"] .sinfo3 .stime{color:rgba(0,0,0,.45)}
  [data-theme="light"] .pcard{box-shadow:0 6px 16px -12px rgba(16,20,28,.5),0 2px 26px -14px rgba(16,20,28,.3)}
  [data-theme="light"] .shufpage .bg{background:#FFFFFF!important;filter:none}
  [data-theme="light"] .shuf .topnav .tab.on::after{background:#78DCBE}
  [data-theme="light"] .sinfo3 .sprog i{background:#7FD8C4}
  [data-theme="light"] .sctl .side{color:#63676D}
  [data-theme="light"] .sctl .pausebtn{color:#76E0BC}
  [data-theme="light"] .sctl .heart.on{color:#E08BA8}
  [data-theme="light"] .shuf .hint{color:rgba(0,0,0,.45)}
</style>
</head>
<body>

<header class="toolbar">
  <div class="brand"><i></i>Prototype Viewer · iA Music</div>
  <div class="seg" id="pageseg"></div>
  <div class="tb-spacer"></div>
  <span class="tb-label">视口</span>
  <div class="seg" id="vseg">
    <button data-v="mobile" class="on">移动 390</button>
    <button data-v="desktop">桌面 1280</button>
  </div>
  <span class="tb-label">四态</span>
  <div class="seg state" id="sseg">
    <button data-s="populated" class="on">正常 Populated</button>
    <button data-s="empty">空 Empty</button>
    <button data-s="loading">加载 Loading</button>
    <button data-s="error">错误 Error</button>
  </div>
  <span class="tb-label">主题</span>
  <div class="seg" id="tseg"><button data-t="dark" class="on">黑夜</button><button data-t="light">白天</button></div>
  <span class="tb-label">语言</span>
  <div class="seg" id="lseg"><button data-l="zh" class="on">中文</button><button data-l="en">EN</button></div>
  <button class="spec-toggle" id="spectog">📐 标尺标注</button>
</header>

<main class="stage">
  <div class="device showspec" id="device"></div>
</main>

<script>
const PAGES=[
  {id:'onboarding',label:'引导'},{id:'discover',label:'音乐空间'},{id:'search',label:'搜索'},
  {id:'mine',label:'我的'},{id:'library',label:'曲库'},{id:'shuffle',label:'随机'},{id:'player',label:'播放'},
  {id:'lyrics',label:'歌词'},{id:'extract',label:'提取'},{id:'sync',label:'同步'},{id:'settings',label:'设置'}
];
const IMMERSIVE=new Set(['onboarding','shuffle','player','lyrics']);
const GRAD=['linear-gradient(135deg,#2b3550,#5b3a62)','linear-gradient(135deg,#1f4a3d,#2b5a74)','linear-gradient(135deg,#4a2b35,#6b4a2b)','linear-gradient(135deg,#2b2b50,#4a3a6b)','linear-gradient(135deg,#3d4a2b,#2b5050)','linear-gradient(135deg,#503a2b,#6b2b4a)'];
const POSTER=['linear-gradient(150deg,#2a4636 0%,#3d5a40 55%,#8a7440 100%)','linear-gradient(150deg,#f9ecc2,#f3dc9e)','linear-gradient(150deg,#fde6a8,#f4cf82)','linear-gradient(150deg,#ef8fb5 0%,#f2c98c 32%,#7fd8ae 64%,#7fa8e8 100%)','linear-gradient(150deg,#c9ecdf,#9fd6c5)'];
const cover=(l,i,s=48)=>`<div class="cover" data-l="${l}" style="width:${s}px;height:${s}px;background:${GRAD[i%GRAD.length]}"></div>`;
const svgPlay=`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>`, svgPause=`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7.5 5h3.2v14H7.5zM13.3 5h3.2v14h-3.2z"/></svg>`;
const iHome=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.8 12 4l8 6.8V20a1 1 0 0 1-1 1h-4.6v-5.6H9.6V21H5a1 1 0 0 1-1-1z"/></svg>`;
const iSearchI=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-3.4-3.4"/></svg>`;
const iUser=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8.2" r="3.7"/><path d="M5 20c1.2-3.4 3.8-5.2 7-5.2s5.8 1.8 7 5.2"/></svg>`;
const iBack=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5 8 12l6.5 7"/></svg>`;
const iShare=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6H6.8A1.8 1.8 0 0 0 5 7.8v9.4A1.8 1.8 0 0 0 6.8 19h9.4a1.8 1.8 0 0 0 1.8-1.8V15"/><path d="M13.5 4H20v6.5"/><path d="M20 4l-8.5 8.5"/></svg>`;
const iGear=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7.5h9"/><path d="M19 7.5h1"/><circle cx="15.5" cy="7.5" r="2.2"/><path d="M4 16.5h1"/><path d="M11 16.5h9"/><circle cx="8.5" cy="16.5" r="2.2"/></svg>`;
const iTrash=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h16"/><path d="M9.5 7V5.6A1.6 1.6 0 0 1 11.1 4h1.8a1.6 1.6 0 0 1 1.6 1.6V7"/><path d="M6.6 7l.8 11.8a1.8 1.8 0 0 0 1.8 1.7h5.6a1.8 1.8 0 0 0 1.8-1.7L17.4 7"/><path d="M10.2 11v5.5M13.8 11v5.5"/></svg>`;
const iNext=`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5.5 15 12l-9 6.5z"/><path d="M17 5.5h2.2v13H17z"/></svg>`;
const iPrev=`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 5.5 9 12l9 6.5z"/><path d="M4.8 5.5H7v13H4.8z"/></svg>`;
const iHeartS=`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.5S4.8 16.1 2.8 11.9C1.2 8.6 3.3 5.2 6.7 5.2c1.9 0 3.4 1 4.3 2.5l1 1.7 1-1.7c.9-1.5 2.4-2.5 4.3-2.5 3.4 0 5.5 3.4 3.9 6.7-2 4.2-9.2 8.6-9.2 8.6z"/></svg>`;
const iClockS=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4.3l2.8 1.6"/></svg>`;
const iDlS=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 4v10.5"/><path d="m7.5 10 4.5 4.5L16.5 10"/><path d="M5 19.5h14"/></svg>`;
const MHEIGHTS=[45,75,55,90,62,80,48,72,58,86,52,68];
const mwave=paused=>`<div class="mwave${paused?' paused':''}">${MHEIGHTS.map((h,i)=>`<i style="height:${h}%;animation-delay:${i*95}ms"></i>`).join('')}</div>`;
const GENRES=[['POP','#F07070','#流行'],['RAP','#FFA14E','#说唱'],['FOLK','#59DFA2','#民谣'],['ROCK','#F75D5D','#摇滚'],['JAZZ','#B08CFF','#爵士'],['R&B','#F0B04A','#节奏布鲁斯'],['ELECTRONIC','#4BDE8E','#电子'],['CLASSICAL','#D8DBDF','#古典']];
const genreGrid=()=>`<div class="h2">分类浏览</div><div class="ggrid">${GENRES.map(([n,c,t])=>`<div class="gcard"><div class="gname" style="color:${c}">${n}</div><span class="gtag">${t}</span></div>`).join('')}</div>`;
const SHUF=[['夜航','陈粒','夜',0],['晚风','某UP主','晚',1],['旧信','乐队A','旧',2],['晴日','乐队B','晴',3],['十点半的地铁','某主播','十',4]];
let shufI=0, stepping=false;
let page='discover', viewport='mobile', state='populated', playing=true, liked=true, showQueue=false, showLyricsMode='timed';
let theme='dark', lang='zh';

/* ---------- 页面渲染器 ---------- */
const R={};

R.onboarding=s=>{
  const dots=`<div style="display:flex;gap:6px;margin-top:20px"><i style="width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block"></i><i style="width:6px;height:6px;border-radius:50%;background:#3a3f46;display:inline-block"></i></div>`;
  if(s==='loading')return`<div class="center"><div class="big">已发现 <span class="tn" id="scanN">128</span> 首…</div><div style="width:70%"><div class="prog" style="height:4px"><i style="width:64%"></i></div></div><p class="muted">扫描 2/3 个目录</p></div>`;
  if(s==='error')return`<div class="center"><div class="big">⚠ 无法访问该文件夹</div><p class="muted">权限不足或设备未连接，请重新选择。</p><div class="two"><button class="btn pri">重新选择文件夹</button><button class="btn">跳过，直接开始</button></div></div>`;
  const counter=s==='empty'?'':`<span class="muted">已发现 <span class="tn">120</span> 首</span>`;
  return`<div class="center"><div class="big" style="font-size:26px">你的音乐放在哪？</div>
    <div class="flat soft" style="width:88%;display:flex;align-items:center;gap:12px;text-align:left">
      <span style="font-size:22px">🗂</span><div style="flex:1"><b style="font-size:14.5px">使用『音乐』文件夹</b><br>${counter}</div>
      <button class="btn pri sm">采用</button>
    </div>
    <button class="btn" style="width:88%">选择其他文件夹</button>${dots}
    <p class="muted" style="margin-top:16px">下一步：试试提取你的第一首歌（可跳过）</p></div>`;
};

R.discover=s=>{
  const hero=empty=>`<div class="mhz" style="margin-top:14px" ${empty?'':`onclick="page='shuffle';render()"`}>
    <div class="art">♫</div>
    <div class="txt"><h3>随机</h3><p>${empty?'曲库是空的。先导入音乐，才能随机播放。':'随机播放我的曲库'}</p>${empty?'':mwave(!playing)}</div>
    ${empty?'':`<span class="disc" onclick="event.stopPropagation();playing=!playing;render()">${playing?svgPause:svgPlay}</span>`}
    <span class="spec" style="top:8px;left:10px">卡 r16 · minH150</span></div>`;
  if(s==='loading')return`<div class="page"><div class="skeleton" style="height:150px;border-radius:16px"></div><div class="h2">最近入库</div><div class="hscroll">${'<div class="hcard"><div class="skeleton" style="width:112px;height:112px"></div><div class="skeleton" style="height:12px;width:80px;margin-top:8px"></div></div>'.repeat(4)}</div></div>`;
  if(s==='error')return`<div class="page"><div class="center"><div class="big">⚠ 本地索引需要重建</div><p class="muted">你的曲库文件与收藏均未受影响。</p><button class="btn">重建索引</button></div></div>`;
  if(s==='empty')return`<div class="page"><div class="h1" style="margin-bottom:16px">音乐空间</div>${hero(true)}
    <div class="two" style="margin-top:16px;flex-wrap:wrap"><button class="btn pri">选择音乐文件夹 ★</button><button class="btn">粘贴一条 B 站链接</button></div></div>`;
  return`<div class="page"><div class="h1">音乐空间</div>${hero(false)}
    <div class="h2">最近入库 <small>查看全部 ›</small></div>
    <div class="hscroll">
      ${['夜航|陈粒','晚风|某UP主','旧信|乐队A','晴日|乐队B','十点半的地铁|某主播'].map((t,i)=>{const[a,b]=t.split('|');return`<div class="hcard">${cover(a[0],i,112)}<b>${a}</b><span>${b}</span></div>`}).join('')}
    </div>
    <div class="h2">我的歌单 <small>＋ 新建歌单</small></div>
    <div class="hscroll">
      <div class="hcard"><div class="cover" data-l="夜" style="width:112px;height:112px;background:${GRAD[2]}"><span class="plbtn">${svgPlay}</span></div><b>深夜电台</b><span>32 首</span></div>
      <div class="hcard"><div class="cover" data-l="通" style="width:112px;height:112px;background:${GRAD[3]}"><span class="plbtn">${svgPlay}</span></div><b>通勤</b><span>18 首</span></div>
      <div class="hcard"><div class="cover" style="width:112px;height:112px;display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--accent);background:var(--surface)">＋</div><b>新建歌单</b></div>
    </div></div>`;
};

R.search=s=>{
  const input=`<div class="searchpill"><span>${iSearchI}</span><span class="q">${state==='empty'?'XX':'夜黑雾'}</span><span class="clr">✕</span></div>`;
  if(s==='error')return`<div class="page"><div class="h1">搜索</div>${input}<div class="center"><div class="big">⚠ 搜索索引损坏</div><p class="muted">你的曲库与收藏不受影响。</p><button class="btn">重建索引</button></div></div>`;
  if(s==='loading')return`<div class="page"><div class="h1">搜索</div>${input}<p class="muted" style="margin-top:12px">搜索中…</p></div>`;
  if(s==='empty')return`<div class="page"><div class="h1">搜索</div>${input}<div class="center"><div class="big">没有找到与「XX」相关的音乐</div><p class="muted">检查拼写，或换一个关键词试试。</p></div>${genreGrid()}</div>`;
  return`<div class="page"><div class="h1">搜索</div>${input}

const ATTR2EN={'粘贴 B 站分享链接':'Paste a Bilibili link','不喜欢':'Not for me','音乐空间':'Music Space','搜索':'Search','我的':'Mine','设置':'Settings','播放队列':'Queue','分享':'Share'};
function localize(){
  const hits=[];
  const tw=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,{acceptNode(n){
    const p=n.parentElement;if(!p)return NodeFilter.FILTER_REJECT;
    const t=p.tagName;if(t==='SCRIPT'||t==='STYLE')return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT;
  }});
  while(tw.nextNode())hits.push(tw.currentNode);
  hits.forEach(n=>{
    const src=(n._zh!==undefined)?n._zh:n.nodeValue;const k=src.trim();if(!k)return;
    const en=ZH2EN[k];if(en===undefined&&n._zh===undefined)return;
    if(n._zh===undefined)n._zh=src;
    n.nodeValue=(lang==='en'&&en!==undefined)?src.replace(k,en):src;
  });
  document.querySelectorAll('[placeholder],[title]').forEach(el=>{
    ['placeholder','title'].forEach(a=>{
      const key='zh'+a,v=el.dataset[key]||el.getAttribute(a);if(!v)return;
      const en=ATTR2EN[v];if(en===undefined&&!el.dataset[key])return;
      el.dataset[key]=v;el.setAttribute(a,lang==='en'&&en!==undefined?en:v);
    });
  });
}
function cycleTheme(){theme=(theme==='dark')?'light':'dark';render();}
function cycleLang(){lang=(lang==='zh')?'en':'zh';render();}

/* ---------- 壳层 ---------- */
const NA_NOTE=`<div class="note" style="margin:12px 20px">该页面在正式规格中无此状态（NA），此处以正常态呈现。</div>`;
function stepUp(){
  const deck=document.getElementById('deck');
  if(!deck||stepping)return;
  stepping=true;
  document.querySelectorAll('.sdeck .pcard').forEach(c=>{
    if(c.classList.contains('slot-cur'))c.className='pcard slot-p1';
    else if(c.classList.contains('slot-p1'))c.className='pcard slot-p2';
    else if(c.classList.contains('slot-p2'))c.className='pcard slot-out';
    else if(c.classList.contains('slot-nxt'))c.className='pcard slot-cur';
    else if(c.classList.contains('slot-nxt2'))c.className='pcard slot-nxt';
  });
  const ni=(shufI+1)%SHUF.length, ai=(shufI+3)%SHUF.length;
  const el=document.createElement('div');
  el.className='pcard slot-in';
  el.style.background=POSTER[SHUF[ai][3]];
  el.innerHTML=`<span class="pl">${SHUF[ai][2]}</span><div class="tags"><span>#电子</span><span>#氛围</span></div>`;
  deck.appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{el.className='pcard slot-nxt2';}));
  const h2=document.querySelector('.sinfo3 h2'),pp=document.querySelector('.sinfo3 p'),pb=document.querySelector('.sinfo3 .sprog i');
  if(h2)h2.textContent=SHUF[ni][0];
  if(pp)pp.textContent=SHUF[ni][1];
  if(pb)pb.style.width='6%';
  setTimeout(()=>{shufI=ni;stepping=false;render();},570);
}
function wireDeck(){
  const deck=document.getElementById('deck');
  if(!deck)return;
  let y0=null;
  deck.addEventListener('pointerdown',e=>{if(stepping)return;y0=e.clientY;deck.style.transition='none';});
  deck.addEventListener('pointermove',e=>{
    if(y0===null||stepping)return;
    const dy=e.clientY-y0;
    deck.style.transform=`rotate(${Math.max(-12,Math.min(0,dy/9))}deg)`;
  });
  deck.addEventListener('pointerup',e=>{
    if(y0===null||stepping)return;
    const dy=e.clientY-y0;y0=null;
    deck.style.transition='transform .5s cubic-bezier(.3,.75,.3,1)';
    deck.style.transform='';
    if(dy<-40)stepUp();
  });
  deck.addEventListener('pointercancel',()=>{y0=null;deck.style.transition='transform .5s';deck.style.transform='';});
}
function render(){
  document.querySelectorAll('#pageseg button').forEach(b=>b.classList.toggle('on',b.dataset.p===page));
  document.querySelectorAll('#vseg button').forEach(b=>b.classList.toggle('on',b.dataset.v===viewport));
  document.querySelectorAll('#sseg button').forEach(b=>b.classList.toggle('on',b.dataset.s===state));
  document.querySelectorAll('#tseg button').forEach(b=>b.classList.toggle('on',b.dataset.t===theme));
  document.querySelectorAll('#lseg button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));

  const dev=document.getElementById('device');
  dev.className='device '+(viewport==='mobile'?'m':'')+(document.getElementById('spectog').classList.contains('on')?' showspec':'');
  if(viewport==='mobile'){dev.style.width='390px';dev.style.height='830px';}else{dev.style.width='1280px';dev.style.height='790px';}
  dev.dataset.theme=theme;
  document.documentElement.lang=(lang==='en')?'en':'zh-CN';

  const naFallback=(page==='mine'&&state==='error')||(page==='settings')||(viewport==='desktop'&&(page==='onboarding'));
  let body=R[page]?R[page](state):'';
  if(naFallback&&R.settings&&page==='settings')body=R.settings(state==='error'?'populated':state);
  const naNote=((page==='settings'&&state!=='populated')||(page==='mine'&&state==='error'))?'':'';

  if(IMMERSIVE.has(page)){
    dev.innerHTML=`<div class="app immersive ${viewport==='mobile'?'mobile':'desktop'}" style="position:relative;flex:1">${body}</div>`;
    if(page==='shuffle')wireDeck();
    localize();
    return;
  }

  const tab=(id,icon,label)=>`<button class="${page===id?'on':''}" data-p="${id}" title="${label}"><span class="ic">${icon}</span></button>`;
  const mini=`<div class="mini" data-p="player"><span class="vinyl" style="animation-play-state:${playing?'running':'paused'}"><i></i></span><span class="t"><b>夜航</b><span> – 陈粒</span></span><div class="ops"><span onclick="event.stopPropagation();playing=!playing;render()">${playing?svgPause:svgPlay}</span><span>☰</span></div></div>`;
  const tabbar=`<nav class="tabbar">${tab('discover',iHome,'音乐空间')}${tab('search',iSearchI,'搜索')}${tab('mine',iUser,'我的')}</nav>`;
  const nav=`<aside class="nav">
    <div class="logo"><i></i>iA Music</div>
    <a class="${page==='discover'?'on':''}" data-p="discover">🏠 音乐空间</a>
    <a class="${page==='search'?'on':''}" data-p="search">🔍 搜索</a>
    <a class="${page==='mine'?'on':''}" data-p="mine">👤 我的</a>
    <a class="${page==='library'?'on':''}" data-p="library">🗀 本地曲库</a>
    <div class="sect">我的歌单</div>
    <div class="pl">· 深夜电台</div><div class="pl">· 通勤</div><div class="pl">· 旧信收藏</div>
    <a class="${page==='settings'?'on':''}" data-p="settings" style="margin-top:auto">⚙ 设置</a>
  </aside>`;
  const playerbar=`<div class="playerbar"><div class="c cover" data-l="夜" style="background:linear-gradient(135deg,#274a5e,#4a2b56)"></div>
    <div class="meta"><b>夜航</b><span>陈粒</span></div>
    <div class="ctl"><span>${iPrev}</span><span onclick="playing=!playing;render()">${playing?svgPause:svgPlay}</span><span>${iNext}</span></div>
    <div class="pg"><span class="tn">01:23</span><div class="prog"><i style="width:34%"></i></div><span class="tn">04:02</span></div>
    <span class="heart on">♥</span><span style="color:#c8ccd2">☰</span>
    <span class="spec" style="top:4px;right:10px">H:72px</span></div>`;

  if(viewport==='mobile'){
    dev.innerHTML=`<div class="app mobile"><main class="content">${body}</main>${mini}${tabbar}
      <span class="spec" style="bottom:118px;left:10px">Mini 52px</span><span class="spec" style="bottom:6px;left:140px">TabBar 56px + SafeArea</span></div>`;
  }else{
    dev.innerHTML=`<div class="app desktop">${nav}<main class="content">${body}</main>${playerbar}
      <span class="spec" style="top:8px;left:8px">Nav 240px</span>
      <span class="spec" style="top:8px;left:260px">Max Width 1080px · Padding 32px</span></div>`;
  }
  localize();
}

document.querySelectorAll('#tseg button').forEach(b=>b.onclick=()=>{theme=b.dataset.t;render();});
document.querySelectorAll('#lseg button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;render();});
document.getElementById('spectog').classList.add('on');
document.getElementById('spectog').onclick=function(){this.classList.toggle('on');render();};
document.addEventListener('click',e=>{
  const p=e.target.closest('[data-p]');
  if(p&&!e.target.closest('#pageseg')){page=p.dataset.p;showQueue=false;render();}
});
